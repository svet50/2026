    body{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;font-family:'TT-Drugs-Medium','CustomLocalFont',sans-serif;
      background:#09090b;color:#f4f4f5;
      padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

    /* Холст: всегда целиком помещается в экран, квадрат по центру (object-fit), без прокрутки */
    /* Телефон: холст — квадрат по ширине экрана (или по высоте, если экран низкий); свободное место делится
       поровну на три промежутка: над холстом, между холстом и кнопками, под кнопками */
    #stage{order:1;flex:none;position:relative;aspect-ratio:1/1;
      width:min(calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)),
                calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 58px - 48px))}
    #mainCanvas{position:absolute;left:0;top:0;width:100%;height:100%;
      object-fit:contain;display:block;opacity:0;transition:opacity .25s ease}
    #mainCanvas.ready{opacity:1}

    /* Кнопки: на телефоне — внизу, крупно, на всю ширину */
    #actions{order:2;flex:none;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
      padding:0 12px}
    .trigger-btn{flex:1 1 0;max-width:170px;min-height:58px;display:inline-flex;align-items:center;justify-content:center;
      background:#18181b;border:1px solid #3f3f46;border-radius:999px;
      font:400 24px/1 'TT-Drugs-Btn','TT-Drugs-Medium',sans-serif;letter-spacing:.01em;color:#f4f4f5;
      cursor:pointer;transition:transform .12s ease,opacity .12s ease,background-color .12s ease}
    .trigger-btn.txt{padding-bottom:4px}   /* оптическая компенсация: надпись на 2px выше */
    .trigger-btn:active{transform:scale(.94);opacity:.85;background:#27272a}
    .heart-icon-anim{display:inline-flex;transform-origin:center;animation:heartPulse 2.2s infinite ease-in-out}
    .heart-icon-anim svg{width:30px;height:30px;fill:#ef4444;display:block}
    @keyframes heartPulse{
      0%{transform:scale(1)}
      14%{transform:scale(1.15)}
      28%{transform:scale(1)}
      42%{transform:scale(1.1)}
      70%,100%{transform:scale(1)}}

    /* Компьютер: кнопки сверху по центру, компактнее */
    @media (min-width:768px){
      body{justify-content:flex-start;align-items:stretch}
      #stage{flex:1 1 0;min-height:0;width:auto;aspect-ratio:auto}
      #mainCanvas{left:12px;top:12px;width:calc(100% - 24px);height:calc(100% - 24px)}
      #actions{order:0;width:auto;justify-content:center;gap:14px;padding:10px 24px}
      .trigger-btn{flex:none;max-width:none;min-height:44px;padding:0 20px;font-size:19px}
      .trigger-btn.txt{padding-bottom:2px}   /* на ПК подъём надписи всего 1px */
      .trigger-btn:hover{background:#27272a;border-color:#71717a}
      .heart-icon-anim svg{width:24px;height:24px}
    }
  </style>

  <script>
    // ---------- СОСТОЯНИЕ ----------
    const FONT_MED = 'TT-Drugs-Medium, CustomLocalFont, sans-serif';
    const FONT_BOLD = 'TT-Drugs-Bold, CustomLocalFont, sans-serif';
    const state = {
      width: 1080, height: 1080,
      lite: false,
      animating: false,
      animStartTime: 0,
      animShapeType: 'text',
      animShapeText: 'B&D',
      shapeCenter: null,
      particles: [],
      gridPoints: []
    };
    const $ = id => document.getElementById(id);
    const canvas = $('mainCanvas');
    const ctx = canvas.getContext('2d');

    // Строка шрифта для canvas: размер округляется до 0.25px, строки кэшируются
    let _fcMed = '', _fcBold = '', _fcTab = [[], []];
    function fnt(bold, size, med, bld) {
      if(med !== _fcMed || bld !== _fcBold) { _fcMed = med; _fcBold = bld; _fcTab = [[], []]; }
      const q = Math.round(size * 4);
      const tab = _fcTab[bold ? 1 : 0];
      return tab[q] || (tab[q] = `${bold ? 700 : 400} ${q / 4}px ${bold ? bld : med}`);
    }

    // ---------- ПОРТРЕТ ----------
    function buildGridPoints() {
      if(!portraitCache) {
        portraitCache = PORTRAIT_GLYPHS.map(g => {
          const code = g[2];
          return {
            x: g[0], y: g[1],
            text: PORTRAIT_CHARS[code % 3],
            fontSize: PORTRAIT_SIZES[Math.floor(code / 6)],
            isBold: Math.floor(code / 3) % 2 === 1,
            lum: 0, isWhite: false
          };
        });
      }
      state.gridPoints = portraitCache;
      return portraitCache;
    }

    function getTextColor() { return '#000000'; }

    function drawBackground() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, state.width, state.height);
    }

    // Статичный портрет: рисуется только по событию (старт, конец анимации, возврат на вкладку), не по таймеру —
    // поэтому нет никакого мерцания
    function render() {
      if(state.animating) return;
      const grid = buildGridPoints();
      ctx.clearRect(0, 0, state.width, state.height);
      drawBackground();
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      for(let i = 0; i < grid.length; i++) {
        const p = grid[i];
        ctx.font = fnt(p.isBold, p.fontSize, FONT_MED, FONT_BOLD);
        ctx.fillText(p.text, p.x, p.y);
      }
    }

    // Холст показываем только когда шрифты готовы и портрет уже нарисован (без «прыжка» шрифта при загрузке)
    function firstRender() {
      render();
      canvas.classList.add('ready');
    }
    (function() {
      let done = false;
      const go = () => { if(done) return; done = true; firstRender(); };
      Promise.all([
        document.fonts.load('400 16px "TT-Drugs-Medium"', 'B&D'),
        document.fonts.load('700 16px "TT-Drugs-Bold"', 'B&D')
      ]).catch(() => {}).then(() => document.fonts.ready).then(go);
      setTimeout(go, 2500);   // страховка, если шрифты не ответили
      if(document.fonts && document.fonts.addEventListener) {
        document.fonts.addEventListener('loadingdone', () => { if(done) render(); });
      }

      document.addEventListener('visibilitychange', () => { if(!document.hidden && done) render(); });

    // Возвращает маску фигуры. Фигура ВСЕГДА центрируется по габаритной рамке в центр холста:
    // исходные контуры в SVG смещены (50 — на ~18px вверх, сердце — на ~14px вправо), текст B&D — по baseline.
    function rasterizeMask(type, shapeText) {
      const W = state.width, H = state.height;
      const off = document.createElement('canvas');
      off.width = W; off.height = H;
      const octx = off.getContext('2d', { willReadFrequently: true });
      const paths = type === 'heart' ? MASK_HEART_PATHS : (type === 'shape50' ? MASK_50_PATHS : null);

      function draw(dx, dy) {
        octx.setTransform(1, 0, 0, 1, 0, 0);
        octx.fillStyle = '#000000';
        octx.fillRect(0, 0, W, H);
        octx.fillStyle = '#ffffff';
        octx.save();
        octx.translate(dx, dy);
        if(paths) {
          // контуры берутся из 50.svg и serdce.svg (viewBox 1080 x 1078.8)
          octx.scale(W / 1080, H / 1078.8);
          paths.forEach(d => octx.fill(new Path2D(d)));
        } else {
          octx.font = `800 ${Math.min(W, H) * 0.38}px ${FONT_BOLD}`;
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          octx.fillText(shapeText, W / 2, H / 2);
        }
        octx.restore();
        return octx.getImageData(0, 0, W, H).data;
      }

      let d = draw(0, 0);
      let minX = W, maxX = -1, minY = H, maxY = -1;
      for(let y = 0; y < H; y++) {
        for(let x = 0; x < W; x++) {
          if(d[(y * W + x) * 4] > 128) {
            if(x < minX) minX = x; if(x > maxX) maxX = x;
            if(y < minY) minY = y; if(y > maxY) maxY = y;
          }
        }
      }
      if(maxX >= 0) {
        const dx = Math.round(W / 2 - (minX + maxX + 1) / 2);
        const dy = Math.round(H / 2 - (minY + maxY + 1) / 2);
        if(dx || dy) d = draw(dx, dy);
      }

      const mask = new Uint8Array(W * H);
      let area = 0;
      for(let i = 0; i < W * H; i++) {
        if(d[i * 4] > 128) { mask[i] = 1; area++; }
      }
      // Размытое поле плотности: 1 внутри формы, плавно падает к 0 за краем — основа «дымки»
      const field = new Float32Array(W * H);
      for(let i = 0; i < W * H; i++) field[i] = mask[i];
      for(let pass = 0; pass < 3; pass++) boxBlur(field, W, H, 10);
      return { mask, area, field };
    }

    // Быстрое разделяемое размытие (бегущая сумма), радиус r
    function boxBlur(arr, W, H, r) {
      const tmp = new Float32Array(Math.max(W, H));
      const inv = 1 / (2 * r + 1);
      // по горизонтали
      for (let y = 0; y < H; y++) {
        const o = y * W;
        let sum = 0;
        for (let x = -r; x <= r; x++) sum += arr[o + Math.min(W - 1, Math.max(0, x))];
        for (let x = 0; x < W; x++) {
          tmp[x] = sum * inv;
          sum += arr[o + Math.min(W - 1, x + r + 1)] - arr[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < W; x++) arr[o + x] = tmp[x];
      }
      // по вертикали
      for (let x = 0; x < W; x++) {
        let sum = 0;
        for (let y = -r; y <= r; y++) sum += arr[Math.min(H - 1, Math.max(0, y)) * W + x];
        for (let y = 0; y < H; y++) {
          tmp[y] = sum * inv;
          sum += arr[Math.min(H - 1, y + r + 1) * W + x] - arr[Math.max(0, y - r) * W + x];
        }
        for (let y = 0; y < H; y++) arr[y * W + x] = tmp[y];
      }
    }

    // Детерминированный генератор случайных чисел (одна и та же форма при каждом запуске)
    function makeRng(seed) {
      let s = seed >>> 0;
      return function() {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Равномерно раскладывает count точек внутри маски (jittered grid)
    function sampleMaskPoints(maskObj, count) {
      const W = state.width, H = state.height;
      const { field } = maskObj;
      const rnd = makeRng(50);
      const pts = [];
      // вероятность появления символа ~ плотность^1.3: внутри плотно, к краю — всё реже (дымка)
      const prob = i => Math.pow(field[i], 1.3);

      let sum = 0;
      for (let i = 0; i < W * H; i++) sum += field[i];
      if (sum === 0) return pts;

      const cell = Math.sqrt(sum / count);
      for (let gy = 0; gy < H; gy += cell) {
        for (let gx = 0; gx < W; gx += cell) {
          for (let k = 0; k < 6; k++) {
            const px = Math.min(W - 1, Math.floor(gx + rnd() * cell));
            const py = Math.min(H - 1, Math.floor(gy + rnd() * cell));
            const i = py * W + px;
            if (field[i] > 0.02 && rnd() < prob(i)) { pts.push({ x: px + rnd(), y: py + rnd(), f: field[i] }); break; }
          }
        }
      }

      // Добираем недостающие точки по той же плотности
      if (pts.length < count) {
        const valid = [];
        for (let i = 0; i < W * H; i++) if (field[i] > 0.02) valid.push(i);
        let guard = 0;
        while (pts.length < count && guard++ < count * 400) {
          const i = valid[Math.floor(rnd() * valid.length)];
          if (rnd() < prob(i)) pts.push({ x: (i % W) + rnd(), y: Math.floor(i / W) + rnd(), f: field[i] });
        }
      }
      // Убираем лишние
      while (pts.length > count) {
        const i = Math.floor(rnd() * pts.length);
        pts[i] = pts[pts.length - 1];
        pts.pop();
      }
      return pts;
    }

    // ---------- ЗАПУСК АНИМАЦИЙ ----------
    function startShapeAnimation(type, shapeText = '') {
      if(state.animating) return;            // пока идёт анимация, повторные нажатия игнорируются
      buildGridPoints();
      const targetPoints = state.gridPoints.filter(p => !p.isWhite);
      if(targetPoints.length === 0) return;

      state.animShapeType = type;
      state.animShapeText = shapeText;

      const maskObj = rasterizeMask(type, shapeText);
      const maskPoints = sampleMaskPoints(maskObj, targetPoints.length);

      // Масштаб символов внутри формы: подбираем так, чтобы буквы закрывали форму плотно,
      // но не сливались в сплошное пятно
      // Размеры и начертания внутри формы раздаём случайно (не по размерам из портрета),
      // иначе крупные и жирные символы центра портрета скапливаются в центре формы
      const shapeRng = makeRng(2026);
      const sizePool = targetPoints.map(p => p.fontSize);
      for(let i = sizePool.length - 1; i > 0; i--) {
        const j = Math.floor(shapeRng() * (i + 1));
        [sizePool[i], sizePool[j]] = [sizePool[j], sizePool[i]];
      }
      let boxArea = 0;
      sizePool.forEach(s => { boxArea += 0.43 * s * s; });
      const shapeScale = Math.max(0.35, Math.min(1, Math.sqrt((maskObj.area * 1.0) / boxArea)));
      const smooth01 = x => { const t = Math.max(0, Math.min(1, x)); return t * t * (3 - 2 * t); };

      // Порядок: символы портрета сверху вниз -> точки формы сверху вниз (плавный «стекающий» полёт)
      const order = targetPoints.map((p, i) => i).sort((a, b) => targetPoints[a].y - targetPoints[b].y);
      const sortedMask = maskPoints.slice().sort((a, b) => a.y - b.y);


      // центр формы = центр холста (фигура уже отцентрована по габаритной рамке), пульсация идёт от него
      state.shapeCenter = { x: state.width / 2, y: state.height / 2 };
      const prng = makeRng(77);

      const particles = new Array(targetPoints.length);
      order.forEach((srcIdx, rank) => {
        const tp = targetPoints[srcIdx];
        const mp = sortedMask[rank];
        particles[rank] = {
          text: tp.text,
          fontSize: tp.fontSize,
          // f — плотность в точке формы (1 в теле, → 0 в дымке у края)
          f: mp.f,
          shapeAlpha: 0.12 + 0.88 * smooth01((mp.f - 0.05) / 0.8),
          shapeSize: Math.max(3, sizePool[rank] * shapeScale * (0.85 + shapeRng() * 0.3) * (0.6 + 0.4 * mp.f)),
          shapeBold: mp.f > 0.65 && shapeRng() < SHAPE_BOLD_RATIO,
          isBold: tp.isBold,
          isWhite: tp.isWhite,
          targetX: tp.x,
          targetY: tp.y,
          startX: mp.x,
          startY: mp.y,
          delayOffset: (rank % 40) * 0.003,
          // случайный вектор разлёта: в середине полёта символ уходит по дуге в сторону и возвращается на траекторию
          scx: Math.cos(prng() * Math.PI * 2) * FLIGHT_SCATTER * (0.35 + prng() * 0.95),
          scy: Math.sin(prng() * Math.PI * 2) * FLIGHT_SCATTER * (0.35 + prng() * 0.95),
          ph1: prng() * Math.PI * 2,
          ph2: prng() * Math.PI * 2,
          ph3: prng() * Math.PI * 2,
          w1: 1.6 + prng() * 2.2,
          w2: 1.1 + prng() * 2.0
        };
      });
      state.particles = particles;

      state.animating = true;
      beginAnimationWithSound(type, animLoop);
    }

    // Планирование звука занимает заметное время (сотни узлов Web Audio) и раньше «съедало» первые кадры.
    // Теперь звук планируется с запасом, а старт анимации сдвигается ровно на этот запас — кадры не пропускаются.
    function beginAnimationWithSound(type, loopFn) {
      let lead = 0;
      const hasAudio = ensureAudio();
      const wall = performance.now();
      if(hasAudio) {
        lead = Math.min(0.6, Math.max(0.05, (sound.schedCost || 120) / 1000 * 1.4 + 0.04));
        scheduleAnimationSound(type, lead);
        sound.schedCost = performance.now() - wall;
      }
      state.animStartTime = wall + lead * 1000;
      requestAnimationFrame(loopFn);
    }

    function dynamicEase(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      return 1 - Math.pow(1 - t, 3);
    }

    // Общий множитель времени: 1.3 = вся анимация медленнее на 30%
    const TIME_SCALE = 1.3;
    // Длительности фаз: портрет -> форма, «живая» форма с сердцебиением, форма -> портрет
    const ANIM_FWD = 1.5 * TIME_SCALE, ANIM_PULSE = 1.6 * TIME_SCALE, ANIM_BACK = 1.5 * TIME_SCALE;
    const ANIM_TOTAL = ANIM_FWD + ANIM_PULSE + ANIM_BACK;
    const FLIGHT_DURATION = 1.3 * TIME_SCALE;
    // Сила разлёта символов в середине перехода, px (0 = летят строго по прямой)
    const FLIGHT_SCATTER = 170;
    // Доля жирных символов внутри формы (остальные Medium)
    const SHAPE_BOLD_RATIO = 0.3;

    // Один и тот же полёт для обоих направлений (одинаковые easing, задержки, параллакс)
    // forward = true: портрет -> форма; false: форма -> портрет
    function drawFlight(flightProgress, forward, timestamp) {
      const textColor = getTextColor();
      const medFont = FONT_MED;
      const boldFont = FONT_BOLD;

      drawBackground(timestamp);
      ctx.fillStyle = textColor;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      state.particles.forEach(p => {
        const localT = Math.max(0, Math.min(1, (flightProgress - p.delayOffset) / (1 - p.delayOffset)));
        const eased = dynamicEase(localT);

        // k: 0 = в портрете, 1 = в форме
        const k = forward ? eased : 1 - eased;
        // разлёт: в середине полёта символ уходит в сторону по своему вектору, к концу возвращается на траекторию
        const arc = Math.sin(Math.PI * eased);
        const currX = p.targetX + (p.startX - p.targetX) * k + p.scx * arc;
        const currY = p.targetY + (p.startY - p.targetY) * k + p.scy * arc;
        const currSize = p.fontSize + (p.shapeSize - p.fontSize) * k;
        ctx.globalAlpha = 1 + (p.shapeAlpha - 1) * k;

        if(p.isWhite && !forward && localT > 0.85) return;

        // Начертание: в форме все жирные, в портрете — «родное»; переключение ровно посередине полёта
        const useBold = k > 0.5 ? p.shapeBold : p.isBold;
        ctx.font = fnt(useBold, currSize, medFont, boldFont);
        ctx.fillText(p.text, currX, currY);
      });
      ctx.globalAlpha = 1;
    }

    // Сердцебиение «тук-тук»: u в [0,1] — один удар сердца
    function beatBump(u, a, peak, b) {
      if(u <= a || u >= b) return 0;
      if(u < peak) { const s = Math.sin((u - a) / (peak - a) * Math.PI / 2); return s * s; }
      const c = Math.cos((u - peak) / (b - peak) * Math.PI / 2); return c * c;
    }
    function heartbeat(u) {
      return beatBump(u, 0.0, 0.12, 0.30) + 0.7 * beatBump(u, 0.34, 0.46, 0.64);
    }
    function smoothstep(a, b, x) {
      const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }

    function animLoop(timestamp) {
      if(!state.animating) return;

      const elapsed = (timestamp - state.animStartTime) / 1000;
      if(elapsed < 0) { requestAnimationFrame(animLoop); return; }   // ждём момента старта звука
      ctx.clearRect(0, 0, state.width, state.height);

      if(elapsed < ANIM_FWD) {
        // Фаза 1: символы портрета перетекают в форму
        drawFlight(elapsed / FLIGHT_DURATION, true, timestamp);

      } else if(elapsed < ANIM_FWD + ANIM_PULSE) {
        // Фаза 2: символы собраны в форму: колышутся, как частицы, и бьются как сердце (тук-тук)
        const e = elapsed - ANIM_FWD;
        const textColor = getTextColor();
        const boldFont = FONT_BOLD;
        const medFont = FONT_MED;
        drawBackground(timestamp);

        // два удара сердца за фазу
        const beats = 2;
        const u = ((e / ANIM_PULSE) * beats) % 1;
        const beat = heartbeat(u);
        const scaleFactor = 1 + 0.085 * beat;
        // плавное включение/выключение колыхания, чтобы не было рывков на стыках с полётом
        const env = smoothstep(0, 0.35, e) * smoothstep(0, 0.35, ANIM_PULSE - e);
        const t = e * 1.0;
        const c = state.shapeCenter || { x: state.width / 2, y: state.height / 2 };

        ctx.fillStyle = textColor;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        state.particles.forEach(p => {
          // у края (малое f) колыхание сильнее, а прозрачность «дышит» — получается дымка
          const amp = 2.4 * env * (1 + 1.6 * beat) * (1 + 1.8 * (1 - p.f));
          const ox = amp * (Math.sin(t * p.w1 + p.ph1) + 0.5 * Math.sin(t * p.w2 * 1.7 + p.ph2));
          const oy = amp * (Math.cos(t * p.w2 + p.ph3) + 0.5 * Math.sin(t * p.w1 * 1.9 + p.ph1));
          const x = c.x + (p.startX - c.x) * scaleFactor + ox;
          const y = c.y + (p.startY - c.y) * scaleFactor + oy;
          const size = p.shapeSize * (1 + 0.12 * beat * env);
          ctx.font = fnt(p.shapeBold, size, medFont, boldFont);
          ctx.globalAlpha = p.shapeAlpha * (1 - 0.3 * (1 - p.f) * (0.5 + 0.5 * Math.sin(t * p.w1 * 0.8 + p.ph2)));
          ctx.fillText(p.text, x, y);
        });
        ctx.globalAlpha = 1;

      } else if(elapsed < ANIM_TOTAL) {
        // Фаза 3: форма -> портрет (тот же полёт, что и в фазе 1, но в обратную сторону)
        drawFlight((elapsed - ANIM_FWD - ANIM_PULSE) / FLIGHT_DURATION, false, timestamp);

      } else {
        state.animating = false;
        render();
        return;
      }

      requestAnimationFrame(animLoop);
    }

    // --- ЗВУК (синтезируется в браузере через Web Audio, файлов не нужно) ---
    const sound = { conv: null, reverbIn: null, ctx: null, echoIn: null, bus: null, mute: null, recDest: null, noise: null, on: true };

    function ensureAudio() {
      if(!sound.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return false;
        sound.ctx = new AC();
        sound.bus = sound.ctx.createGain();          // общая шина эффектов
        sound.bus.gain.value = 0.9;
        sound.mute = sound.ctx.createGain();         // кнопка mute влияет только на динамики
        sound.mute.gain.value = sound.on ? 1 : 0;
        sound.recDest = sound.ctx.createMediaStreamDestination(); // сюда пишется звук для видео (всегда)
        // мастер-обработка: тёплые низы, мягкие верха, лёгкая компрессия (полнее и «взрослее»)
        const warm = sound.ctx.createBiquadFilter();
        warm.type = 'lowshelf'; warm.frequency.value = 220; warm.gain.value = 3.5;
        const air = sound.ctx.createBiquadFilter();
        air.type = 'highshelf'; air.frequency.value = 5500; air.gain.value = -4;
        const comp = sound.ctx.createDynamicsCompressor();
        comp.threshold.value = -20; comp.knee.value = 24; comp.ratio.value = 3; comp.attack.value = 0.012; comp.release.value = 0.28;
        const makeup = sound.ctx.createGain();
        makeup.gain.value = 1.3;
        sound.bus.connect(warm); warm.connect(air); air.connect(comp); comp.connect(makeup);
        makeup.connect(sound.mute);
        sound.mute.connect(sound.ctx.destination);
        makeup.connect(sound.recDest);
        // эхо для искр: задержка с затухающей обратной связью и срезом верхов
        sound.echoIn = sound.ctx.createGain();
        sound.echoIn.gain.value = 0.55;
        const delay = sound.ctx.createDelay(1.0);
        delay.delayTime.value = 0.23;
        const fb = sound.ctx.createGain();
        fb.gain.value = 0.38;
        const damp = sound.ctx.createBiquadFilter();
        damp.type = 'lowpass'; damp.frequency.value = 6000;
        sound.echoIn.connect(delay);
        delay.connect(damp); damp.connect(fb); fb.connect(delay);
        damp.connect(sound.bus);
        // белый шум для «вжуха»
        const len = sound.ctx.sampleRate * 3;
        const buf = sound.ctx.createBuffer(1, len, sound.ctx.sampleRate);
        const ch = buf.getChannelData(0);
        for(let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        sound.noise = buf;
        // длинная мягкая реверберация (синтезированный импульс), для эмбиент-пространства
        const rl = Math.floor(sound.ctx.sampleRate * 3.6);
        const rb = sound.ctx.createBuffer(2, rl, sound.ctx.sampleRate);
        for(let chn = 0; chn < 2; chn++) {
          const d = rb.getChannelData(chn);
          let y = 0;
          for(let i = 0; i < rl; i++) {
            const x = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6);
            y += 0.42 * (x - y);            // срез верхов, чтобы хвост был бархатным
            d[i] = y;
          }
        }
        const conv = sound.ctx.createConvolver();
        conv.buffer = rb;
        sound.reverbIn = sound.ctx.createGain();
        sound.reverbIn.gain.value = 1;
        const rvOut = sound.ctx.createGain();
        rvOut.gain.value = 0.85;
        sound.conv = conv;
        conv.connect(rvOut); rvOut.connect(sound.bus);
        if(!state.lite) sound.reverbIn.connect(conv);      // в лёгком режиме свёртка (самая «тяжёлая» часть звука) выключена
      }
      if(sound.ctx.state === 'suspended') sound.ctx.resume();
      return true;
    }

    // --- ПРАЗДНИЧНЫЙ ЗВУК ФОРМЫ: тёплая мажорная музыка (до мажор) в трёх вариантах ---
    const N = { C3: 130.81, G3: 196.0, C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.0, A4: 440.0, B4: 493.88,
                C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0, C6: 1046.5, D6: 1174.7, E6: 1318.5, G6: 1568.0, C7: 2093.0 };

    // Выход ноты: панорама + отправка в эхо
    function routeOut(node, pan, send, rev = 0) {
      const c = sound.ctx;
      let out = node;
      if(c.createStereoPanner) {
        const p = c.createStereoPanner();
        p.pan.value = pan;
        node.connect(p);
        out = p;
      }
      out.connect(sound.bus);
      const s = c.createGain();
      s.gain.value = send;
      out.connect(s); s.connect(sound.echoIn);
      if(rev > 0 && sound.reverbIn) {
        const rg = c.createGain();
        rg.gain.value = rev;
        out.connect(rg); rg.connect(sound.reverbIn);
      }
    }

    // Арфа: тёплый щипок (треугольник + октава), быстрый срез верхов
    function sfxHarp(t0, freq, vol, pan = 0) {
      const c = sound.ctx;
      freq *= sound.pitch;
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(vol, t0 + 0.004);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.5);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(Math.min(9000, freq * 7), t0);
      lp.frequency.exponentialRampToValueAtTime(Math.max(600, freq * 1.5), t0 + 0.6);
      lp.connect(env);
      [['triangle', 1, 1.0], ['sine', 2, 0.3], ['sine', 3, 0.1]].forEach(([type, r, amp]) => {
        const o = c.createOscillator();
        o.type = type; o.frequency.value = freq * r;
        const g = c.createGain(); g.gain.value = amp;
        o.connect(g); g.connect(lp);
        o.start(t0); o.stop(t0 + 1.6);
      });
      routeOut(env, pan, 0.45);
    }

    // Музыкальная шкатулка: чистый тон + быстро гаснущие верхние гармоники
    function sfxMusicBox(t0, freq, vol, pan = 0) {
      const c = sound.ctx;
      freq *= sound.pitch;
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(vol, t0 + 0.003);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
      [[1, 1.0, 1.2], [3, 0.28, 0.3], [6.1, 0.1, 0.12]].forEach(([r, amp, dec]) => {
        const o = c.createOscillator();
        o.type = 'sine'; o.frequency.value = freq * r;
        const g = c.createGain();
        g.gain.setValueAtTime(amp, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
        o.connect(g); g.connect(env);
        o.start(t0); o.stop(t0 + dec + 0.05);
      });
      routeOut(env, pan, 0.4);
    }

    // Колокол: тёплый, с «гулом» октавой ниже, без стеклянной остроты
    function sfxBell(t0, freq, vol, pan = 0) {
      const c = sound.ctx;
      freq *= sound.pitch;
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
      [[0.5, 0.45, 2.2], [1, 1.0, 2.2], [2, 0.5, 1.4], [2.99, 0.28, 0.9], [4.1, 0.12, 0.45]].forEach(([r, amp, dec]) => {
        const o = c.createOscillator();
        o.type = 'sine'; o.frequency.value = freq * r;
        const g = c.createGain();
        g.gain.setValueAtTime(amp, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
        o.connect(g); g.connect(env);
        o.start(t0); o.stop(t0 + dec + 0.05);
      });
      routeOut(env, pan, 0.5);
    }

    // Струнная подкладка: мягкие пилы с расстройкой через фильтр, медленное нарастание и затухание
    function sfxStrings(t0, dur, freqs, vol) {
      const c = sound.ctx;
      const master = c.createGain();
      const att = Math.min(0.7, dur * 0.4);
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(vol, t0 + att);
      master.gain.setValueAtTime(vol, t0 + dur * 0.6);
      master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.8);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(700, t0);
      lp.frequency.exponentialRampToValueAtTime(2200, t0 + att);
      lp.frequency.exponentialRampToValueAtTime(900, t0 + dur + 0.8);
      lp.connect(master);
      const per = 1 / (freqs.length * 3);
      freqs.forEach(f0 => {
        const f = f0 * sound.pitch;
        [-8, 0, 8].forEach(det => {
          const o = c.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
          const g = c.createGain(); g.gain.value = per;
          o.connect(g); g.connect(lp);
          o.start(t0); o.stop(t0 + dur + 0.9);
        });
      });
      routeOut(master, 0, 0.25);
    }

    // Три варианта «живой» формы. Все — в до мажоре, тёплые и торжественные.
    const SOUND_STYLES = {
      // Арфа и струнные: торжественно, как поздравление на сцене
      harp: (t0, dur) => {
        sfxStrings(t0, dur, [N.C3, N.G3, N.E4, N.B4, N.D5], 0.12);
        [N.C4, N.E4, N.G4, N.C5, N.E5, N.G5, N.C6].forEach((f, i) => sfxHarp(t0 + i * 0.08, f, 0.10, -0.5 + i * 0.16));
        [N.E6, N.C6, N.G5, N.E5].forEach((f, i) => sfxHarp(t0 + 1.05 + i * 0.13, f, 0.07, 0.6 - i * 0.3));
        sfxHarp(t0 + 1.75, N.C7, 0.05, 0.2);
      },
      // Музыкальная шкатулка: нежная, тёплая мелодия
      musicbox: (t0, dur) => {
        sfxStrings(t0, dur, [N.C3, N.G3, N.E4], 0.05);
        const mel = [[0, N.C5], [0.2, N.E5], [0.4, N.G5], [0.6, N.C6], [0.8, N.E6], [1.0, N.G6],
                     [1.3, N.E6], [1.55, N.D6], [1.8, N.C6]];
        mel.forEach(([t, f], i) => sfxMusicBox(t0 + t, f, 0.11, -0.4 + (i % 5) * 0.2));
        sfxMusicBox(t0, N.C4, 0.12, 0);
        sfxMusicBox(t0 + 1.0, N.G3, 0.12, 0);
      },
      // Колокола: мягкий праздничный перезвон
      carillon: (t0, dur) => {
        sfxStrings(t0, dur, [N.C3, N.G3, N.E4], 0.04);
        const mel = [[0, N.G5], [0.38, N.E5], [0.76, N.C5], [1.14, N.G5], [1.52, N.E6]];
        mel.forEach(([t, f], i) => sfxBell(t0 + t, f, 0.10, -0.5 + i * 0.25));
        sfxBell(t0, N.C4, 0.12, 0);
      }
    };
    sound.style = 'ambient_low';
    sound.pitch = 1;

    function sfxSparkle(t0, dur) {
      (SOUND_STYLES[sound.style] || SOUND_STYLES.harp)(t0, dur);
    }

    // =====================================================================
    // ЭМБИЕНТ-ТЕХНО (в духе раннего эмбиент-техно начала 90-х: мягкий круглый бочонок,
    // тёплый саб-бас, расстроенные пады, пентатонные арпеджио, длинная реверберация).
    // Весь ритм привязан к таймлайну анимации: сетка стоит на первом ударе сердца формы,
    // удары сердца = бочонок + «призрачный» бочонок, пады «дышат» от сайдчейна.
    // =====================================================================
    function ambKick(t, vol, hi = 150, lo = 48, dec = 0.42) {
      const c = sound.ctx;
      const o = c.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(hi, t);
      o.frequency.exponentialRampToValueAtTime(lo, t + 0.08);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
      o.connect(g);
      o.start(t); o.stop(t + dec + 0.05);
      routeOut(g, 0, 0, 0.06);
    }

    function ambHat(t, vol, open, pan) {
      const c = sound.ctx;
      const n = c.createBufferSource();
      n.buffer = sound.noise;
      const hp = c.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 5000;
      const g = c.createGain();
      const len = open ? 0.24 : 0.04;
      g.gain.setValueAtTime(vol * 0.7, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      n.connect(hp); hp.connect(g);
      n.start(t, Math.random() * 2); n.stop(t + len + 0.02);
      routeOut(g, pan, 0.12, 0.12);
    }

    function ambClap(t, vol) {
      const c = sound.ctx;
      [0, 0.011, 0.022].forEach((d, i) => {
        const n = c.createBufferSource();
        n.buffer = sound.noise;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.1;
        const g = c.createGain();
        const last = i === 2;
        g.gain.setValueAtTime(vol, t + d);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + (last ? 0.16 : 0.012));
        n.connect(bp); bp.connect(g);
        n.start(t + d, Math.random() * 2); n.stop(t + d + 0.2);
        routeOut(g, 0.05, 0.1, 0.35);
      });
    }

    function ambBass(t, freq, len, vol) {
      const c = sound.ctx;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 2.2;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      [['sine', 1, 1.0], ['triangle', 2, 0.3], ['sine', 3, 0.14], ['sine', 4, 0.07]].forEach(([type, r, amp]) => {
        const o = c.createOscillator();
        o.type = type; o.frequency.value = freq * r;
        const og = c.createGain(); og.gain.value = amp;
        o.connect(og); og.connect(lp);
        o.start(t); o.stop(t + len + 0.05);
      });
      lp.connect(g);
      routeOut(g, 0, 0, 0.04);
    }

    // Расстроенный пад: пилы через фильтр, который медленно открывается и закрывается
    function ambPad(t, dur, freqs, vol, duck, rel = 1.2) {
      const c = sound.ctx;
      const master = c.createGain();
      const att = dur * 0.45;
      master.gain.setValueAtTime(0.0001, t);
      master.gain.exponentialRampToValueAtTime(vol, t + att);
      master.gain.setValueAtTime(vol, t + dur * 0.7);
      master.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 1.4;
      lp.frequency.setValueAtTime(380, t);
      lp.frequency.exponentialRampToValueAtTime(1900, t + att);
      lp.frequency.exponentialRampToValueAtTime(650, t + dur + rel);
      lp.connect(master);
      master.connect(duck);
      const per = 1 / (freqs.length * 3);
      freqs.forEach(f => {
        [-9, 0, 9].forEach(det => {
          const o = c.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
          const g = c.createGain(); g.gain.value = per;
          o.connect(g);
          if(c.createStereoPanner && det !== 0) {      // левый и правый голоса расстроены в разные стороны — широкий пад
            const pn = c.createStereoPanner();
            pn.pan.value = det < 0 ? -0.65 : 0.65;
            g.connect(pn); pn.connect(lp);
          } else g.connect(lp);
          o.start(t); o.stop(t + dur + rel + 0.05);
        });
      });
    }

    // Вокальный пад: пилы через формантные фильтры гласной «а» (альт) с лёгким вибрато — тёплый женский «хор»
    function ambVoice(t, dur, freqs, vol, duck, rel = 1.2) {
      const c = sound.ctx;
      const master = c.createGain();
      const att = Math.min(dur * 0.5, 1.1);
      master.gain.setValueAtTime(0.0001, t);
      master.gain.exponentialRampToValueAtTime(vol, t + att);
      master.gain.setValueAtTime(vol, t + dur * 0.7);
      master.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
      master.connect(duck);
      const lfo = c.createOscillator();
      lfo.type = 'sine'; lfo.frequency.value = 5.1;
      const lfoG = c.createGain();
      lfoG.gain.value = 7;                               // глубина вибрато, центов
      lfo.connect(lfoG);
      lfo.start(t); lfo.stop(t + dur + rel + 0.05);
      const bus = c.createGain();
      [[700, 1.0, 5], [1150, 0.55, 6], [2650, 0.2, 8]].forEach(([f, a, q]) => {   // форманты «а»
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
        const g = c.createGain(); g.gain.value = a;
        bus.connect(bp); bp.connect(g); g.connect(master);
      });
      const per = 1 / (freqs.length * 2);
      freqs.forEach(f => {
        [-6, 6].forEach(det => {
          const o = c.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
          lfoG.connect(o.detune);
          const g = c.createGain(); g.gain.value = per;
          o.connect(g); g.connect(bus);
          o.start(t); o.stop(t + dur + rel + 0.05);
        });
      });
    }

    // Нарастание (reverse-cymbal): шум с поднимающимся фильтром — подводка к пику
    function ambRiser(t, dur, vol) {
      const c = sound.ctx;
      const n = c.createBufferSource();
      n.buffer = sound.noise;
      const bp = c.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 0.8;
      bp.frequency.setValueAtTime(1200, t);
      bp.frequency.exponentialRampToValueAtTime(6500, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.04);
      n.connect(bp); bp.connect(g);
      n.start(t, Math.random()); n.stop(t + dur + 0.06);
      routeOut(g, 0, 0.1, 0.5);
    }

    // Тарелка-«крэш»: шум с высоким срезом и долгим затуханием, чуть приглушён
    function ambCrash(t, vol, dur = 2.2) {
      const c = sound.ctx;
      const n = c.createBufferSource();
      n.buffer = sound.noise;
      const hp = c.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 3800;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 9000;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      n.connect(hp); hp.connect(lp); lp.connect(g);
      n.start(t, Math.random()); n.stop(t + dur + 0.05);
      routeOut(g, 0, 0.12, 0.6);
    }

    // Глубокий колокол: мягкая атака, малая терция (меланхоличный, «взрослый» тембр), пары расстроенных
    // синусов слева и справа (хор и ширина), срез верхов, очень длинный хвост в реверберации
    function sfxDeepBell(t, freq, vol, pan = 0, len = 3.6, wide = true) {
      const c = sound.ctx;
      const out = c.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(vol, t + 0.014);
      out.gain.exponentialRampToValueAtTime(0.0001, t + len);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 0.5;
      lp.frequency.setValueAtTime(Math.min(6000, freq * 7), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(500, freq * 2.2), t + 1.2);
      lp.connect(out);
      const sides = (state.lite || !wide) ? [0] : [-1, 1];
      [[0.5, 0.5, 1.0], [1, 1.0, 0.9], [1.2, 0.42, 0.6], [1.5, 0.3, 0.5], [2, 0.4, 0.45], [2.51, 0.14, 0.25], [3.0, 0.1, 0.18]]
        .forEach(([r, a, d], i) => {
          sides.forEach(side => {
            const o = c.createOscillator();
            o.type = 'sine'; o.frequency.value = freq * r; o.detune.value = side * (2 + i * 0.7);
            const g = c.createGain();
            g.gain.setValueAtTime(a / sides.length, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + len * d);
            o.connect(g);
            if(c.createStereoPanner && side) {
              const pn = c.createStereoPanner();
              pn.pan.value = side * 0.45;
              g.connect(pn); pn.connect(lp);
            } else g.connect(lp);
            o.start(t); o.stop(t + len * d + 0.05);
          });
        });
      routeOut(out, pan, 0.3, 0.85);
    }

    function ambPluck(t, freq, vol, pan) {
      const c = sound.ctx;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(1900, t);
      lp.frequency.exponentialRampToValueAtTime(480, t + 0.4);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
      [['triangle', 1, 0.8, -6], ['triangle', 1, 0.8, 6], ['sine', 2, 0.18, 0], ['sine', 0.5, 0.35, 0]].forEach(([type, r, amp, det]) => {
        const o = c.createOscillator();
        o.type = type; o.frequency.value = freq * r; o.detune.value = det;
        const og = c.createGain(); og.gain.value = amp;
        o.connect(og); og.connect(lp);
        o.start(t); o.stop(t + 0.9);
      });
      lp.connect(g);
      routeOut(g, pan, 0.6, 0.7);   // точечная задержка + глубокая реверберация
    }

    // Плавающий синусный «взлёт/падение» вместо вжуха (без шума)
    function ambGlide(t, dur, f0, f1, vol) {
      const c = sound.ctx;
      const o = c.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      o.start(t); o.stop(t + dur + 0.05);
      routeOut(g, 0, 0.3, 0.6);
    }

    function scheduleAmbient(v, t0) {
      const c = sound.ctx;
      const r = sound.pitch;                       // ля минор, транспонированный под кнопку
      const hz = semi => 220 * r * Math.pow(2, semi / 12);   // semi — полутоны от A3

      // Сетка: один удар сердца формы = H = 2 доли (≈115 BPM). Начало сетки = первый «тук» формы.
      const H = ANIM_PULSE / 2, B = H / 2, S = B / 4;
      const g0 = t0 + ANIM_FWD + 0.12 * H;
      const now = c.currentTime;
      const at = t => Math.max(t, now + 0.005);
      if(sound.delay) sound.delay.delayTime.value = B * 0.75;   // задержка «пунктиром»

      // Сайдчейн: пады «приседают» на каждом бочонке
      const duck = c.createGain();
      duck.gain.value = 1;
      routeOut(duck, 0, 0.18, 0.5);
      const kicks = [];

      const rng = makeRng(900 + v.pitch * 7);
      let arpIdx = 2;
      const penta = [-5, -3, 0, 2, 4, 7, 9];       // мажорная пентатоника ля мажор: ми3 ... фа#4 (светло, но не высоко)

      for(let cy = -2; cy <= 3; cy++) {
        const g = g0 + cy * H;
        const sw = i => g + i * S + (i % 2 ? S * 0.14 : 0);   // лёгкий свинг на нечётных 16-х

        // бочонок и «призрачный» бочонок (второй тук сердца)
        if(cy >= -1 && cy <= 2) {
          ambKick(at(g), cy === -1 ? 0.5 : cy === 2 ? 0.7 : 0.5);
          kicks.push([g, cy === -1 ? 0.7 : 1]);
        }
        if(cy >= 0 && cy <= 1) {
          ambKick(at(g + 0.34 * H), 0.2, 120, 52, 0.26);
          // сердцебиение «тук-тук» теперь звучит колокольчиками (ля — ми), бочонок лишь подкладывает пульс
          // низкие колокола (ля — ми) с суб-октавой + тёплый «женский» глубокий колокол октавой выше
          sfxHeartBell(at(g), hz(-12), 0.3, -0.1, true);
          sfxHeartBell(at(g + 0.34 * H), hz(-5), 0.22, 0.1, true);
          sfxDeepBell(at(g), hz(0), 0.17, 0);
          sfxDeepBell(at(g + 0.34 * H), hz(7), 0.12, 0);
          if(cy === 0) sfxDeepBell(at(g), hz(12), 0.05, 0, 4.4);   // тихий высокий отзвук на первом ударе
          kicks.push([g + 0.34 * H, 0.6]);
        }
        // клэп на второй доле
        if(cy >= 0 && cy <= 2) ambClap(at(g + 4 * S), cy === 2 ? 0.09 : 0.16);

        // хэты
        const closed = cy === -2 ? [3, 7] : cy === 3 ? [] : [1, 3, 5, 7];
        const hv = cy === -2 ? 0.045 : cy === -1 ? 0.065 : cy <= 1 ? 0.085 : 0.055;
        closed.forEach((s, i) => ambHat(at(sw(s)), hv * (s % 4 === 3 ? 1.15 : 0.85), false, ((i % 2) ? 0.3 : -0.3)));
        if(cy >= 0 && cy <= 1) ambHat(at(sw(6)), 0.07, true, 0.2);

        // бас: ля / фа / ля — i–VI–i
        if(cy >= -1 && cy <= 2) {
          const root = cy === 1 ? -19 : -24;           // A (I) -> D (IV) -> A: мажорный «праздничный» ход
          const third = 4;
          const bv = cy === -1 ? 0.2 : 0.38;
          const bass = [[g, 0, 0.34], [g + 0.34 * H, 0, 0.18], [g + 5 * S, third + 12, 0.16], [g + 7 * S, 7 + 12, 0.14]];
          bass.forEach(([bt, off, len], i) => {
            if(cy === -1 && i > 0) return;
            ambBass(at(bt), hz(root + off), len, bv);
          });
        }

        // арпеджио (пентатоника, случайное блуждание), с задержкой пунктиром и реверберацией
        if(cy >= -1 && cy <= 3) {
          const av = cy === -1 ? 0.05 : cy <= 1 ? 0.075 : cy === 2 ? 0.06 : 0.04;
          [0, 2, 4, 6].forEach((s, i) => {
            if(cy === 3 && i > 1) return;
            const stepDir = [1, 2, -1, 1, -2][Math.floor(rng() * 5)];
            arpIdx = Math.max(0, Math.min(penta.length - 1, arpIdx + stepDir));
            ambPluck(at(sw(s)), hz(penta[arpIdx]), av * (i === 0 ? 1.1 : 0.9), -0.5 + (i / 3));
          });
        }
      }

      // Сайдчейн-автоматизация пада (строго по возрастанию времени)
      kicks.sort((a, b) => a[0] - b[0]).forEach(([kt, depth]) => {
        const tt = at(kt);
        duck.gain.setValueAtTime(1 - 0.5 * depth, tt);
        duck.gain.linearRampToValueAtTime(1, tt + 0.3);
      });

      // Пады — мажор: ля мажор add9 (сбор) -> ля мажор / ре мажор (форма живёт) -> ля мажор add9 (возврат, светлый финал)
      const AM = [hz(-12), hz(-5), hz(4), hz(7), hz(14)];
      ambPad(at(t0), g0 - t0 + 0.2, AM, 0.14, duck, 0.9);
      ambPad(at(g0), H, [hz(-12), hz(-5), hz(4), hz(7), hz(11)], 0.14, duck, 0.5);
      ambPad(at(g0 + H), H, [hz(-7), hz(0), hz(5), hz(9), hz(12)], 0.14, duck, 0.9);
      ambPad(at(g0 + 2 * H - 0.15), ANIM_TOTAL - (g0 - t0) - 2 * H + 0.1, AM, 0.14, duck, 1.8);

      // Вокальный пад («а» альтом) поверх тех же аккордов
      ambVoice(at(t0), g0 - t0 + 0.2, [hz(0), hz(4), hz(7), hz(14)], 0.26, duck, 0.9);
      ambVoice(at(g0), H, [hz(0), hz(4), hz(7), hz(11)], 0.26, duck, 0.5);
      ambVoice(at(g0 + H), H, [hz(0), hz(5), hz(9), hz(12)], 0.26, duck, 0.9);
      ambVoice(at(g0 + 2 * H - 0.15), ANIM_TOTAL - (g0 - t0) - 2 * H + 0.1, [hz(0), hz(4), hz(7), hz(14)], 0.26, duck, 2.0);

      // ===== ПРАЗДНИК =====
      // 1) перезвон колоколов вверх по ля мажору при сборе формы + нарастание
      [12, 14, 16, 19, 21, 24].forEach((semi, i) => sfxDeepBell(at(g0 - 1.3 + i * 0.2), hz(semi), 0.045 + 0.012 * i, -0.5 + i * 0.2, 2.6, false));
      ambRiser(at(g0 - 1.2), 1.2, 0.07);
      // 2) пик: тарелка, литавры и тёплые фанфары (ля мажор, затем ре мажор)
      ambCrash(at(g0), 0.08, 2.4);
      sfxTimpani(at(g0), hz(-12), 0.55);
      sfxTimpani(at(g0 + H), hz(-7), 0.42);
      [0, 7, 12, 16].forEach((semi, i) => clBrass(at(g0), hz(semi), 0.95, 0.034, -0.3 + i * 0.2));
      [5, 9, 12, 17].forEach((semi, i) => clBrass(at(g0 + H), hz(semi), 0.95, 0.03, -0.3 + i * 0.2));
      // 3) искры конфетти: редкие тихие звоны, пока форма живёт
      const srng = makeRng(31 + v.pitch);
      const spark = [24, 26, 28, 31, 33];
      for(let i = 0; i < 7; i++) {
        sfxDeepBell(at(g0 + 0.2 + srng() * (2 * H - 0.4)), hz(spark[Math.floor(srng() * spark.length)]), 0.022, srng() * 1.2 - 0.6, 1.4, false);
      }
      // 4) финал: большой аккорд колоколов с литаврами, когда символы вернулись в портрет
      const fin = g0 + 2 * H + 1.35;
      [[0, 0.1, -0.3], [7, 0.08, 0.3], [12, 0.065, -0.15], [16, 0.045, 0.15], [-12, 0.12, 0]].forEach(([semi, vv, pn]) => sfxDeepBell(at(fin), hz(semi), vv, pn, 4.4));
      sfxTimpani(at(fin), hz(-12), 0.5);
      ambCrash(at(fin), 0.05, 2.6);

      // «Взлёт» при сборе формы и «падение» при разлёте — чистые синусные глайды
      ambGlide(at(g0 - 1.15), 1.15, 220 * r, 1300 * r, 0.05);
      ambGlide(at(g0 + 2 * H - 0.13), FLIGHT_DURATION, 1300 * r, 220 * r, 0.045);
    }

    // Колокольчик сердцебиения: мягкая FM-атака, тёплые обертоны, длинный хвост с реверберацией
    function sfxHeartBell(t, freq, vol, pan = 0, dark = false) {
      const c = sound.ctx;
      const car = c.createOscillator();
      car.type = 'sine'; car.frequency.value = freq;
      const mod = c.createOscillator();
      mod.type = 'sine'; mod.frequency.value = freq * (dark ? 2.0 : 3.5);
      const mg = c.createGain();
      mg.gain.setValueAtTime(freq * (dark ? 0.9 : 1.2), t);
      mg.gain.exponentialRampToValueAtTime(freq * 0.02, t + (dark ? 0.7 : 0.45));
      mod.connect(mg); mg.connect(car.frequency);
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      env.gain.exponentialRampToValueAtTime(0.0001, t + (dark ? 2.6 : 1.9));
      car.connect(env);
      car.start(t); mod.start(t);
      car.stop(t + (dark ? 2.7 : 2.0)); mod.stop(t + 0.8);
      if(dark) {
        // низкий «басовый» колокол: добавляем суб-октаву и тёмный обертон, без блестящих верхов
        const sub = c.createOscillator();
        sub.type = 'sine'; sub.frequency.value = freq * 0.5;
        const sg = c.createGain();
        sg.gain.setValueAtTime(0.8, t);
        sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
        sub.connect(sg); sg.connect(env);
        sub.start(t); sub.stop(t + 1.9);
        const mid = c.createOscillator();
        mid.type = 'sine'; mid.frequency.value = freq * 1.5;
        const mg2 = c.createGain();
        mg2.gain.setValueAtTime(0.22, t);
        mg2.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        mid.connect(mg2); mg2.connect(env);
        mid.start(t); mid.stop(t + 1.0);
      } else {
        // верхний тихий обертон «колокольчика»
        const hi = c.createOscillator();
        hi.type = 'sine'; hi.frequency.value = freq * 2.76;
        const hg = c.createGain();
        hg.gain.setValueAtTime(0.18, t);
        hg.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        hi.connect(hg); hg.connect(env);
        hi.start(t); hi.stop(t + 0.7);
      }
      routeOut(env, pan, dark ? 0.2 : 0.45, dark ? 0.35 : 0.55);
    }

    // =====================================================================
    // РАММШТАЙН (индастриал-метал): тяжёлые «глухие» риффы в ре миноре, маршевые барабаны,
    // гейтед-малый, органно-хоровая подкладка, металлические удары. Всё синтезируется кодом.
    // Сетка привязана к анимации: «тук-тук» сердца формы = тяжёлый бочонок + там-там.
    // =====================================================================
    // Общий гитарный тракт: дисторшн → кабинет. Каждый «чаг» подаётся с собственным фильтром (палм-мьют).
    function rmGuitarBus() {
      const c = sound.ctx;
      const input = c.createGain();
      input.gain.value = 5.5;                                  // драйв
      const ws = c.createWaveShaper();
      const n = 1024, curve = new Float32Array(n);
      for(let i = 0; i < n; i++) { const x = i * 2 / (n - 1) - 1; curve[i] = Math.tanh(3.2 * x) * 0.9; }
      ws.curve = curve; ws.oversample = '4x';
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 65;
      const mid = c.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 850; mid.gain.value = 4; mid.Q.value = 0.9;
      const cab = c.createBiquadFilter(); cab.type = 'lowpass'; cab.frequency.value = 4800;
      const out = c.createGain(); out.gain.value = 0.2;
      input.connect(ws); ws.connect(hp); hp.connect(mid); mid.connect(cab); cab.connect(out);
      routeOut(out, 0, 0.04, 0.1);
      return input;
    }

    // Палм-мьют «чаг» / открытый аккорд: квинта + октава на пилах, фильтр быстро закрывается
    function rmChug(bus, t, freq, len, vol) {
      const c = sound.ctx;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 1.2;
      lp.frequency.setValueAtTime(3600, t);
      lp.frequency.exponentialRampToValueAtTime(len > 0.2 ? 900 : 380, t + len);
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(vol, t + 0.003);
      env.gain.setValueAtTime(vol, t + Math.min(0.04, len * 0.3));
      env.gain.exponentialRampToValueAtTime(0.0001, t + len);
      [[1, -7], [1, 7], [1.498, 0], [2, 4]].forEach(([r, det]) => {
        const o = c.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = freq * r; o.detune.value = det;
        const g = c.createGain(); g.gain.value = 0.25;
        o.connect(g); g.connect(lp);
        o.start(t); o.stop(t + len + 0.05);
      });
      lp.connect(env); env.connect(bus);
    }

    // Тяжёлый маршевый бочонок: глубокий удар + щелчок бойка
    function rmKick(t, vol) {
      ambKick(t, vol, 165, 40, 0.55);
      const c = sound.ctx;
      const n = c.createBufferSource();
      n.buffer = sound.noise;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2800;
      const g = c.createGain();
      g.gain.setValueAtTime(vol * 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
      n.connect(hp); hp.connect(g);
      n.start(t, Math.random() * 2); n.stop(t + 0.02);
      routeOut(g, 0, 0, 0.02);
    }

    // Малый барабан с гейтед-ревербом (хвост резко обрывается)
    function rmSnare(t, vol) {
      const c = sound.ctx;
      const n = c.createBufferSource();
      n.buffer = sound.noise;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2100; bp.Q.value = 0.7;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      n.connect(bp); bp.connect(g);
      n.start(t, Math.random() * 2); n.stop(t + 0.25);
      const o = c.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(240, t);
      o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
      const og = c.createGain();
      og.gain.setValueAtTime(vol * 0.7, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(og);
      o.start(t); o.stop(t + 0.2);
      // гейтед-реверберация: хвост подаётся в реверб и обрывается через 0.22 с
      const gate = c.createGain();
      gate.gain.setValueAtTime(0.5, t);
      gate.gain.setValueAtTime(0.5, t + 0.2);
      gate.gain.linearRampToValueAtTime(0.0, t + 0.23);
      g.connect(gate); og.connect(gate);
      if(sound.reverbIn) gate.connect(sound.reverbIn);
      routeOut(g, 0, 0, 0); routeOut(og, 0, 0, 0);
    }

    // Тарелка (крэш)
    function rmCrash(t, vol, dur = 1.8) {
      const c = sound.ctx;
      const n = c.createBufferSource();
      n.buffer = sound.noise;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3400;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      n.connect(hp); hp.connect(g);
      n.start(t, Math.random() * 1.5); n.stop(t + dur + 0.05);
      routeOut(g, 0, 0.05, 0.25);
    }

    // Металлический удар по наковальне: неточные обертоны, быстрый срез
    function rmClank(t, freq, vol) {
      const c = sound.ctx;
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(vol, t + 0.002);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      [[1, 1], [2.32, 0.6], [3.87, 0.4], [5.41, 0.25], [7.1, 0.15]].forEach(([r, amp]) => {
        const o = c.createOscillator();
        o.type = 'sine'; o.frequency.value = freq * r;
        const g = c.createGain();
        g.gain.setValueAtTime(amp, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9 / (1 + r * 0.4));
        o.connect(g); g.connect(env);
        o.start(t); o.stop(t + 0.95);
      });
      routeOut(env, 0, 0.05, 0.3);
    }

    // Нарастающий индастриал-рисер: пила через дисторшн, высота ползёт вверх; падение — вниз
    function rmSweep(bus, t, dur, f0, f1, vol) {
      const c = sound.ctx;
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
      lp.frequency.setValueAtTime(Math.max(200, f0 * 3), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(300, f1 * 3), t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.8);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(lp); lp.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.05);
    }

    function scheduleRammstein(v, t0) {
      const c = sound.ctx;
      const r = sound.pitch;                           // ре минор, транспонированный под кнопку
      const D2 = 73.42 * r;
      const f = semi => D2 * Math.pow(2, semi / 12);
      const H = ANIM_PULSE / 2, B = H / 2, S = B / 4;
      const g0 = t0 + ANIM_FWD + 0.12 * H;            // первый «тук» формы — начало сетки
      const now = c.currentTime;
      const at = t => Math.max(t, now + 0.005);
      const endT = t0 + ANIM_TOTAL;
      if(sound.delay) sound.delay.delayTime.value = B * 0.75;

      const gtr = rmGuitarBus();
      const duck = c.createGain();                     // сайдчейн для органа
      duck.gain.value = 1;
      routeOut(duck, 0, 0.1, 0.55);
      const kicks = [];

      // Ритмические рисунки чагов: шаг (16-я) -> полутоны от ре
      const RIFFS = [
        { 0: 0, 1: 0, 2: 0, 4: 0, 5: 0, 7: 3 },
        { 0: 0, 1: 0, 2: 0, 4: 5, 5: 5, 7: 3 },
        { 0: 0, 1: 0, 2: 0, 4: 3, 5: 3, 7: -2 }
      ];

      // --- Сбор в форму: рисер, гул, барабанная дробь, затем удар на первом «туке» ---
      rmSweep(gtr, at(t0), ANIM_FWD - 0.05, 60 * r, 700 * r, 0.16);
      ambPad(at(t0), ANIM_FWD + 0.2, [f(-24 + 12), f(-24 + 19)], 0.12, duck, 0.6);   // низкий гул ре-ля
      const rollStart = g0 - 1.35, rollN = 16;
      let tr = rollStart;
      for(let i = 0; i < rollN; i++) {
        rmSnare(at(tr), 0.05 + 0.13 * (i / (rollN - 1)));
        tr += 0.14 * Math.pow(0.9, i);
      }

      for(let cy = -1; cy <= 3; cy++) {
        const g = g0 + cy * H;
        const sw = i => g + i * S;
        const riff = RIFFS[(cy + 1) % RIFFS.length];
        const lvl = cy === -1 ? 0.55 : cy <= 1 ? 1.0 : cy === 2 ? 0.6 : 0.35;

        // барабаны: бочонок — тук 1, там-там — тук 2 (оба совпадают с ударами сердца на экране)
        if(cy <= 2) {
          if(cy >= 0 && cy <= 1) {
            rmKick(at(g), 1.0);                        kicks.push([g, 1]);
            ambKick(at(g + 0.34 * H), 0.75, 125, 60, 0.4);   // там-там
            kicks.push([g + 0.34 * H, 0.7]);
            rmSnare(at(sw(4)), 0.34);
            rmKick(at(sw(6)), 0.55);                   kicks.push([sw(6), 0.5]);
          } else {
            rmKick(at(g), cy === -1 ? 0.55 : 0.6);     kicks.push([g, 0.6]);
            if(cy === 2) rmSnare(at(sw(4)), 0.18);
          }
          // хет на восьмых
          [0, 2, 4, 6].forEach(s => ambHat(at(sw(s)), 0.045 * lvl, false, s % 4 ? 0.25 : -0.25));
        }

        // гитарные чаги
        if(cy <= 2) {
          Object.keys(riff).forEach(k => {
            const s = +k;
            const open = (s === 0 || s === 4);
            rmChug(gtr, at(sw(s)), f(riff[k]), open ? 0.3 : 0.1, (open ? 0.85 : 0.65) * lvl);
          });
        }
      }

      // Акценты: открытый квинтаккорд + крэш + металл на первом «туке» формы
      rmCrash(at(g0), 0.16, 2.0);
      rmChug(gtr, at(g0), f(0), 1.1, 0.9);
      rmClank(at(g0), 330 * r, 0.1);

      // Сайдчейн-«приседание» органа на каждом ударе
      kicks.sort((a, b) => a[0] - b[0]).forEach(([kt, depth]) => {
        const tt = at(kt);
        duck.gain.setValueAtTime(1 - 0.55 * depth, tt);
        duck.gain.linearRampToValueAtTime(1, tt + 0.28);
      });

      // Орган/хор: ре минор в форме, затем возврат; тёмно и торжественно
      ambPad(at(g0), 2 * H, [f(-12), f(-5), f(0), f(3), f(7)], 0.13, duck, 0.9);
      ambPad(at(g0 + 2 * H - 0.15), ANIM_TOTAL - (g0 - t0) - 2 * H + 0.1, [f(-12), f(-5), f(0), f(7)], 0.13, duck, 1.6);

      // Разлёт в портрет: падающий гул вниз и финальный удар, когда всё встало на места
      rmSweep(gtr, at(g0 + 2 * H - 0.13), FLIGHT_DURATION * 0.9, 600 * r, 55 * r, 0.14);
      const endHit = endT - 0.12;
      rmKick(at(endHit), 1.0);
      rmCrash(at(endHit), 0.17, 2.2);
      rmChug(gtr, at(endHit), f(0), 1.6, 0.85);
      rmClank(at(endHit), 247 * r, 0.09);
    }

    // =====================================================================
    // «БИТ ПО РЕФЕРЕНСУ» — современный тёмный бит. Параметры сняты с анализа вашего видео:
    // темп ≈ 83–87 BPM, центр — до (C), мощный саб-бас (≈35% энергии ниже 120 Гц) и плотный низ-середина,
    // быстрые хэты, удар на первой доле такта, фразы «голосовых» синтезаторов, смена баса C → F → C.
    // Мелодия и ритм написаны заново (это не копия трека). Сетка привязана к анимации:
    // «тук-тук» сердца = бочонок на раз и на «раз-и» — классический синкопированный рисунок.
    // =====================================================================
    // Шина 808: мягкая перегрузка добавляет гармоники, чтобы бас был слышен и на маленьких динамиках
    function trBassBus() {
      const c = sound.ctx;
      const input = c.createGain();
      input.gain.value = 2.2;
      const ws = c.createWaveShaper();
      const n = 1024, curve = new Float32Array(n);
      for(let i = 0; i < n; i++) { const x = i * 2 / (n - 1) - 1; curve[i] = Math.tanh(2.0 * x) * 0.9; }
      ws.curve = curve; ws.oversample = '2x';
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.7;
      const out = c.createGain(); out.gain.value = 0.55;
      input.connect(ws); ws.connect(lp); lp.connect(out);
      routeOut(out, 0, 0, 0.03);
      return input;
    }

    // Басовая «808»: синус с быстрым падением тона; glideTo — медленный сброс высоты (для «дропа»)
    function tr808(bus, t, freq, len, vol, glideTo = 0) {
      const c = sound.ctx;
      const o = c.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * 2.3, t);
      o.frequency.exponentialRampToValueAtTime(freq, t + 0.05);
      if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + len);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      g.gain.setValueAtTime(vol, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + len + 0.05);
    }

    // Рваный «пульсирующий» бас низ-середины: короткие ноты пилой через фильтр
    function trPulse(bus, t, freq, len, vol) {
      const c = sound.ctx;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 3;
      lp.frequency.setValueAtTime(900, t);
      lp.frequency.exponentialRampToValueAtTime(220, t + len);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      [['sawtooth', 1, 0.6], ['square', 1, 0.3]].forEach(([type, r, amp]) => {
        const o = c.createOscillator();
        o.type = type; o.frequency.value = freq * r;
        const og = c.createGain(); og.gain.value = amp;
        o.connect(og); og.connect(lp);
        o.start(t); o.stop(t + len + 0.05);
      });
      lp.connect(g); g.connect(bus);
    }

    // «Голосовая» нота: пила с вибрато через два форманты («о–а»), мягкая атака — тёмная фраза поверх бита
    function trVoice(t, freq, dur, vol, pan = 0) {
      const c = sound.ctx;
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(vol, t + 0.09);
      env.gain.setValueAtTime(vol, t + Math.max(0.1, dur - 0.25));
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
      const lfo = c.createOscillator(); lfo.frequency.value = 5.2;
      const lg = c.createGain(); lg.gain.value = 9;          // вибрато ±9 центов
      lfo.connect(lg);
      [[620, 6], [1150, 8]].forEach(([fc, q]) => {
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = fc; bp.Q.value = q;
        const fg = c.createGain(); fg.gain.value = fc < 800 ? 1.0 : 0.6;
        [-6, 6].forEach(det => {
          const o = c.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = det;
          lg.connect(o.detune);
          o.connect(bp);
          o.start(t); o.stop(t + dur + 0.3);
        });
        bp.connect(fg); fg.connect(env);
      });
      lfo.start(t); lfo.stop(t + dur + 0.3);
      routeOut(env, pan, 0.35, 0.6);
    }

    function scheduleTrap(v, t0) {
      const c = sound.ctx;
      const r = sound.pitch;                           // до, транспонированная под кнопку
      const C2 = 65.41 * r;
      const f = semi => C2 * Math.pow(2, semi / 12);
      const H = ANIM_PULSE / 2;
      const b = H / 1.5;                               // доля (≈ 86 BPM): сердцебиение = 1.5 доли
      const q = b / 4;                                 // 16-я
      const g0 = t0 + ANIM_FWD + 0.12 * H;             // первый «тук» формы = первая доля такта
      const now = c.currentTime;
      const at = t => Math.max(t, now + 0.005);
      const endT = t0 + ANIM_TOTAL;
      if(sound.delay) sound.delay.delayTime.value = b * 0.75;

      const bass = trBassBus();
      const duck = c.createGain();
      duck.gain.value = 1;
      routeOut(duck, 0, 0.12, 0.5);
      const kicks = [];

      // --- Нагнетание (3 доли до первой доли такта) ---
      ambPad(at(t0), ANIM_FWD + 0.2, [f(12), f(19), f(26), f(28)], 0.1, duck, 0.6);
      ambGlide(at(t0 + 0.2), ANIM_FWD - 0.3, 110 * r, 1300 * r, 0.05);                 // рисер
      // нарастающая хэт-дробь
      let th = g0 - 1.7;
      for(let i = 0; i < 14; i++) { ambHat(at(th), 0.03 + 0.09 * (i / 13), false, (i % 2) ? 0.3 : -0.3); th += 0.17 * Math.pow(0.9, i); }
      // «голос» подхватывает рисер
      trVoice(at(g0 - 1.3), f(31), 0.9, 0.035, -0.2);

      // --- Удар на первой доле: суб + крэш ---
      tr808(bass, at(g0), f(0), 1.5, 0.95);
      rmCrash(at(g0), 0.12, 1.8);

      // --- Форма живёт: 2 удара сердца = бочонок на «раз» и на «раз-и», клэп на третьей доле ---
      for(let cy = 0; cy <= 1; cy++) {
        const g = g0 + cy * H;
        ambKick(at(g), 0.95, 150, 50, 0.33);          kicks.push([g, 1]);
        ambKick(at(g + 0.34 * H), 0.7, 130, 52, 0.28); kicks.push([g + 0.34 * H, 0.7]);
        if(cy === 0) tr808(bass, at(g + 0.34 * H), f(0), 0.45, 0.7);
        else tr808(bass, at(g + 0.34 * H), f(3), 0.5, 0.65);              // ми-бемоль: тёмный ход
      }
      ambClap(at(g0 + 2 * b), 0.2);                                       // клэп на 3-й доле (≈ тук 2 второго удара)

      // хэты 16-ми с акцентами и быстрой дробью в конце «такта»
      for(let i = 0; i < 12; i++) {
        const th2 = g0 + i * q;
        ambHat(at(th2), (i % 2 ? 0.035 : 0.065), i === 10, (i % 4) < 2 ? -0.3 : 0.3);
      }
      for(let i = 0; i < 6; i++) ambHat(at(g0 + 2.5 * b + i * q / 2), 0.035 + i * 0.01, false, i % 2 ? 0.3 : -0.3);

      // рваный бас низ-середины (шестнадцатые), чтобы был плотный «низ»
      for(let i = 1; i < 12; i++) {
        if(i === 2) continue;
        trPulse(bass, at(g0 + i * q), f(i % 4 === 3 ? 12 : 0), q * 0.7, 0.09);
      }

      // фраза «голосом» (нисходящая, пентатоника до): до — ля — соль — ми
      [[0, 36], [1.0, 33], [1.75, 31], [2.25, 28]].forEach(([k, semi], i) => {
        trVoice(at(g0 + k * b), f(semi), 0.6 * b, 0.05, -0.25 + i * 0.15);
      });

      // --- Разлёт: бас уходит на фа (IV ступень), «дроп» вниз, хэты стихают ---
      const backStart = g0 + 2 * H - 0.13;
      tr808(bass, at(backStart), f(-7), 1.2, 0.85, f(-7) * 0.7);           // фа
      ambKick(at(backStart), 0.6, 140, 50, 0.3);   kicks.push([backStart, 0.6]);
      ambPad(at(backStart), ANIM_TOTAL - (backStart - t0) - 0.4, [f(17), f(21), f(24), f(28)], 0.1, duck, 1.4);
      [0, 2, 4].forEach(i => ambHat(at(backStart + 0.5 + i * q * 2), 0.04, false, 0.2));
      trVoice(at(backStart + 0.2), f(36), 1.4, 0.045, 0.1);
      trVoice(at(backStart + 0.2), f(31), 1.4, 0.03, -0.1);

      // --- Финал: когда всё встало на места — удар и аккорд до ---
      const endHit = endT - 0.12;
      ambKick(at(endHit), 0.9, 150, 48, 0.4);        kicks.push([endHit, 1]);
      tr808(bass, at(endHit), f(0), 2.0, 0.9);
      ambPad(at(endHit), 1.2, [f(12), f(19), f(28), f(36)], 0.12, duck, 1.8);
      ambClap(at(endHit), 0.12);
      ambGlide(at(endHit - 0.15), 0.15, 400 * r, 2000 * r, 0.02);

      // сайдчейн: пады и «голоса» приседают от бочонка
      kicks.sort((a, b2) => a[0] - b2[0]).forEach(([kt, depth]) => {
        const tt = at(kt);
        duck.gain.setValueAtTime(1 - 0.5 * depth, tt);
        duck.gain.linearRampToValueAtTime(1, tt + 0.3);
      });
    }

    // =====================================================================
    // КЛАССИКА (камерный оркестр): струнные, арфа, пиццикато, литавры, флейта.
    // Оригинальная пьеса в до мажоре, 115 BPM, один такт на каждую фазу анимации:
    //   такт 1 — нагнетание на доминанте (G): арфа вверх, дробь литавр, струнные крещендо;
    //   такт 2 — тема в форме на тонике (C → F → G): скрипка + флейта, арфа-альберти, пиццикато;
    //            сердцебиение = литавры «тук-тук» (до — соль);
    //   такт 3 — разлёт: гамма арфы вниз, G7, финальная каденция в до мажор.
    // =====================================================================
    // Струнная группа: расстроенные пилы с вибрато через мягкий фильтр
    function clStrings(t, dur, freqs, vol, att = 0.15, rel = 0.35) {
      const c = sound.ctx;
      const master = c.createGain();
      master.gain.setValueAtTime(0.0001, t);
      master.gain.exponentialRampToValueAtTime(vol, t + att);
      master.gain.setValueAtTime(vol, t + Math.max(att, dur));
      master.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 3000; lp.Q.value = 0.6;
      lp.connect(master);
      const lfo = c.createOscillator(); lfo.frequency.value = 5.3;
      const lg = c.createGain(); lg.gain.value = 7;
      lfo.connect(lg);
      const per = 1 / (freqs.length * 3);
      freqs.forEach(fr => {
        [-9, 0, 9].forEach(det => {
          const o = c.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = det;
          lg.connect(o.detune);
          const g = c.createGain(); g.gain.value = per;
          o.connect(g); g.connect(lp);
          o.start(t); o.stop(t + dur + rel + 0.05);
        });
      });
      lfo.start(t); lfo.stop(t + dur + rel + 0.05);
      routeOut(master, 0, 0.1, 0.55);
    }

    // Соло-скрипка + флейта на октаву выше
    function clViolin(t, freq, dur, vol, pan = 0, flute = true) {
      const c = sound.ctx;
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(vol, t + 0.07);
      env.gain.setValueAtTime(vol, t + Math.max(0.08, dur - 0.1));
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.14);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = Math.min(6000, freq * 5); lp.Q.value = 0.8;
      lp.connect(env);
      const lfo = c.createOscillator(); lfo.frequency.value = 5.6;
      const lg = c.createGain(); lg.gain.value = 8;
      lfo.connect(lg);
      [-5, 5].forEach(det => {
        const o = c.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = det;
        lg.connect(o.detune);
        const g = c.createGain(); g.gain.value = 0.5;
        o.connect(g); g.connect(lp);
        o.start(t); o.stop(t + dur + 0.2);
      });
      if(flute) {
        const fl = c.createOscillator();
        fl.type = 'sine'; fl.frequency.value = freq * 2;
        const fg = c.createGain(); fg.gain.value = 0.22;
        lg.connect(fl.detune);
        fl.connect(fg); fg.connect(env);
        fl.start(t); fl.stop(t + dur + 0.2);
      }
      lfo.start(t); lfo.stop(t + dur + 0.2);
      routeOut(env, pan, 0.25, 0.5);
    }

    // Пиццикато контрабасов/виолончелей
    function clPizz(t, freq, vol) {
      const c = sound.ctx;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(1400, t);
      lp.frequency.exponentialRampToValueAtTime(300, t + 0.3);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
      [['triangle', 1, 1.0], ['sine', 2, 0.3]].forEach(([type, r, amp]) => {
        const o = c.createOscillator();
        o.type = type; o.frequency.value = freq * r;
        const og = c.createGain(); og.gain.value = amp;
        o.connect(og); og.connect(lp);
        o.start(t); o.stop(t + 0.42);
      });
      lp.connect(g);
      routeOut(g, -0.15, 0.1, 0.25);
    }

    function scheduleClassic(v, t0) {
      const c = sound.ctx;
      const r = sound.pitch;                           // до мажор, транспонированный под кнопку
      // hz — «чистая» частота (арфа сама применяет транспонирование), fr — с транспонированием
      const hz = semi => 65.41 * Math.pow(2, semi / 12);
      const fr = semi => hz(semi) * r;
      const H = ANIM_PULSE / 2;
      const b = H / 2;                                 // доля (≈ 115 BPM): сердцебиение = 2 доли
      const e = b / 2;                                 // восьмая
      const g0 = t0 + ANIM_FWD + 0.12 * H;             // первый «тук» формы = первая доля 2-го такта
      const now = c.currentTime;
      const at = t => Math.max(t, now + 0.005);
      const endT = t0 + ANIM_TOTAL;
      if(sound.delay) sound.delay.delayTime.value = e * 1.5;

      // ---------- Такт 1: нагнетание на доминанте (G) ----------
      clStrings(at(t0), 4 * b - 0.1, [fr(19), fr(23), fr(26), fr(31)], 0.16, 3.0, 0.4);
      clStrings(at(t0), 4 * b, [fr(7), fr(14)], 0.09, 2.6, 0.4);                  // виолончели/басы
      [[0, [7, 19, 23, 26, 31, 35, 38, 43]], [2 * b, [19, 23, 26, 31, 35, 38, 43, 47]]].forEach(([off, notes], k) => {
        notes.forEach((semi, i) => sfxHarp(at(t0 + off + i * (k ? e / 3 : e / 2)), hz(semi), 0.06 + i * 0.004, -0.5 + i * 0.14));
      });
      // дробь литавр на соль: ускоряется и усиливается
      let tr = g0 - 2 * b;
      for(let i = 0; i < 11; i++) { sfxTimpani(at(tr), fr(7), 0.08 + 0.3 * (i / 10)); tr += 0.2 * Math.pow(0.88, i); }
      // затакт скрипки: си — ре → ведёт в ми
      clViolin(at(g0 - b), fr(35), e * 1.6, 0.05, -0.15);
      clViolin(at(g0 - e), fr(38), e * 0.95, 0.055, -0.1);

      // ---------- Такт 2: тема в форме ----------
      // tutti на первой доле: аккорд до мажор + удар литавр + тарелка
      clStrings(at(g0), 2 * b, [fr(12), fr(19), fr(24), fr(28), fr(31)], 0.2, 0.03, 0.5);
      rmCrash(at(g0), 0.07, 1.6);
      // сердцебиение: литавры до — соль (два удара сердца за такт)
      for(let cy = 0; cy <= 1; cy++) {
        const g = g0 + cy * H;
        sfxTimpani(at(g), fr(0), cy ? 0.6 : 0.85);
        sfxTimpani(at(g + 0.34 * H), fr(7), cy ? 0.42 : 0.55);
      }
      // тема: арпеджио вверх, затем гамма вниз (длины в восьмых)
      [[0, 40, 2], [2, 43, 2], [4, 48, 3], [7, 47, 1], [8, 45, 2], [10, 43, 2], [12, 40, 2], [14, 38, 2]].forEach(([s, semi, len], i) => {
        clViolin(at(g0 + s * e), fr(semi), len * e * 0.95, 0.06, -0.2 + i * 0.05);
      });
      // гармония струнных по долям: C | C | F | G
      [[0, 8, [12, 19, 28]], [8, 4, [17, 24, 33]], [12, 4, [19, 26, 35]]].forEach(([s, len, ch]) => {
        clStrings(at(g0 + s * e + 0.05), len * e - 0.1, ch.map(fr), 0.07, 0.12, 0.3);
      });
      // арфа-альберти: бас-верх-середина-верх
      const chordAt = s => s < 8 ? [24, 28, 31] : s < 12 ? [29, 33, 36] : [31, 35, 38];
      for(let s = 0; s < 16; s++) {
        const ch = chordAt(s);
        const semi = [ch[0], ch[2], ch[1], ch[2]][s % 4];
        sfxHarp(at(g0 + s * e), hz(semi), 0.045, -0.3 + (s % 4) * 0.2);
      }
      // пиццикато баса
      [[0, 12], [4, 7], [8, 5], [12, 7]].forEach(([s, semi]) => clPizz(at(g0 + s * e), fr(semi), 0.22));

      // ---------- Такт 3: разлёт и каденция ----------
      const backStart = g0 + 2 * H - 0.13;
      // гамма арфы вниз по всему перелёту
      [55, 53, 52, 50, 48, 47, 45, 43, 41, 40, 38, 36].forEach((semi, i) => {
        sfxHarp(at(backStart + i * (FLIGHT_DURATION * 0.8 / 12)), hz(semi), 0.075 - i * 0.003, 0.6 - i * 0.1);
      });
      // доминантсептаккорд, мелодия: ре — си — соль — фа
      clStrings(at(backStart), 4 * e, [fr(19), fr(23), fr(26), fr(29)], 0.12, 0.1, 0.3);
      [[0, 50, 2], [2, 47, 2], [4, 43, 2], [6, 41, 1.4]].forEach(([s, semi, len], i) => {
        clViolin(at(backStart + s * e), fr(semi), len * e * 0.95, 0.055, 0.2 - i * 0.1);
      });
      clPizz(at(backStart), fr(7), 0.22);
      clPizz(at(backStart + 4 * e), fr(7), 0.18);

      // финал: когда всё встало на места — до мажор: ми у скрипки/флейты, tutti, литавры, арфа, тарелка
      const endHit = endT - 0.12;
      clStrings(at(endHit), 1.3, [fr(12), fr(19), fr(24), fr(28), fr(31), fr(36)], 0.22, 0.03, 0.9);
      clViolin(at(endHit), fr(40), 1.3, 0.07, 0);
      sfxTimpani(at(endHit), fr(0), 0.95);
      clPizz(at(endHit), fr(0), 0.25);
      [24, 28, 31, 36, 40, 43, 48].forEach((semi, i) => sfxHarp(at(endHit + i * 0.06), hz(semi), 0.07, -0.4 + i * 0.13));
      rmCrash(at(endHit), 0.08, 2.0);
    }

    // =====================================================================
    // КЛАССИКА · «КАРТИНКИ С ВЫСТАВКИ» (по мотивам сюиты М. П. Мусоргского)
    // Дух сюиты: «Прогулка» в Си-бемоль мажоре «в русском стиле», шаг «вразвалку» (чередование 5/4 и 6/4),
    // соло трубы, тяжёлый хорал меди с колоколами, как в «Богатырских воротах».
    // Музыка написана заново в этом духе (это НЕ точная цитата темы «Прогулки»). Темп ≈ 115 BPM:
    // вся анимация ≈ 11.5 долей, то есть 5/4 + 6/4, а удар сердца формы приходится на ударную долю.
    // =====================================================================
    // Медная группа: пилы + квадрат через фильтр, который «раскрывается» на атаке (типичный «блеск» меди)
    function clBrass(t, freq, dur, vol, pan = 0) {
      const c = sound.ctx;
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(vol, t + 0.05);
      env.gain.setValueAtTime(vol, t + Math.max(0.06, dur - 0.12));
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.16);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 1.1;
      lp.frequency.setValueAtTime(Math.min(3500, freq * 2), t);
      lp.frequency.exponentialRampToValueAtTime(Math.min(5000, freq * 6.5), t + 0.12);
      lp.frequency.exponentialRampToValueAtTime(Math.min(3200, freq * 3.2), t + Math.max(0.2, dur));
      lp.connect(env);
      [['sawtooth', -4, 0.45], ['sawtooth', 4, 0.45], ['square', 0, 0.2]].forEach(([type, det, amp]) => {
        const o = c.createOscillator();
        o.type = type; o.frequency.value = freq; o.detune.value = det;
        const g = c.createGain(); g.gain.value = amp;
        o.connect(g); g.connect(lp);
        o.start(t); o.stop(t + dur + 0.2);
      });
      routeOut(env, pan, 0.12, 0.5);
    }

    function scheduleMussorgsky(v, t0) {
