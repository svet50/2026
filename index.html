      const c = sound.ctx;
      const r = sound.pitch;                           // Си-бемоль мажор, транспонированный под кнопку
      // semi — полутоны от Bb2 (116.54 Гц); hz — «чистая» частота (арфа/колокол сами транспонируют), fr — с транспонированием
      const hz = semi => 116.54 * Math.pow(2, semi / 12);
      const fr = semi => hz(semi) * r;
      const H = ANIM_PULSE / 2;
      const b = H / 2;                                 // доля
      const g0 = t0 + ANIM_FWD + 0.12 * H;            // первый «тук» формы ≈ 4-я доля от начала
      const p0 = g0 - 4 * b;
      const now = c.currentTime;
      const at = t => Math.max(t, now + 0.005);
      const endT = t0 + ANIM_TOTAL;
      const endHit = endT - 0.12;
      if(sound.delay) sound.delay.delayTime.value = b * 0.75;

      // ---------- Фраза 1 (5/4, шаг «вразвалку»): соло трубы, пиццикато-«шаги», дробь литавр ----------
      clStrings(at(p0), 4 * b + 0.2, [fr(-12), fr(-5)], 0.12, 1.2, 0.5);                  // тихий гул Си♭—Фа
      [-12, -5, -12, -5].forEach((semi, i) => clPizz(at(p0 + i * b), fr(semi), 0.2));      // «шаги» посетителя
      // соло трубы: начинается с VI ступени (соль), как отмечают аналитики «Прогулки»; мелодия — своя
      [[0, 21, 1], [1, 24, 0.5], [1.5, 26, 0.5], [2, 28, 1], [3, 26, 0.5], [3.5, 24, 0.5]].forEach(([beat, semi, len], i) => {
        clBrass(at(p0 + beat * b), fr(semi), len * b * 0.95, 0.07, -0.1 + i * 0.03);
      });
      // дробь литавр на Си♭, нарастающая к первому «туку»
      let tr = g0 - 1.6 * b;
      for(let i = 0; i < 9; i++) { sfxTimpani(at(tr), fr(-12), 0.06 + 0.3 * (i / 8)); tr += 0.14 * Math.pow(0.9, i); }

      // ---------- Фраза 2 (6/4): тяжёлый хорал меди с колоколами, в такт сердцу ----------
      // tutti на первой доле: Си♭ мажор, тарелка, колокол
      rmCrash(at(g0), 0.07, 1.6);
      // хорал: аккорд — длина в долях — голоса (полутоны от Bb2): I | vi | IV(Ми♭) | V(Фа, до финала)
      const chords = [
        [0, 2, [0, 7, 12, 16, 19]],
        [2, 1, [-3, 4, 9, 12, 16]],
        [3, 1, [-7, 0, 5, 9, 12]],
        [4, (endHit - g0) / b - 4, [-5, 2, 7, 11, 14]]
      ];
      chords.forEach(([beat, len, notes], k) => {
        const st = g0 + beat * b + 0.02, du = len * b - 0.05;
        notes.forEach((semi, i) => clBrass(at(st), fr(semi), du, 0.045, -0.3 + i * 0.15));
        clStrings(at(st), du, notes.map(fr), 0.08, 0.12, 0.3);
        sfxBell(at(g0 + beat * b), hz(notes[2] + 12), 0.08, 0.2 - k * 0.1);                 // колокол на корне аккорда
      });
      // мелодия хорала (скрипки + флейта): ре — си♭ — соль — ля — до — ля, затем разрешение
      [[0, 28, 2], [2, 24, 1], [3, 21, 1], [4, 23, 1], [5, 26, 1], [6, 23, (endHit - g0) / b - 6]].forEach(([beat, semi, len]) => {
        clViolin(at(g0 + beat * b), fr(semi), len * b * 0.95, 0.06, 0.15);
        clBrass(at(g0 + beat * b), fr(semi), len * b * 0.95, 0.035, 0);
      });
      // бас (туба/контрабасы) по корням аккордов
      [[0, -12, 2], [2, -3, 1], [3, -7, 1], [4, -5, (endHit - g0) / b - 4]].forEach(([beat, semi, len]) => clBrass(at(g0 + beat * b), fr(semi), len * b, 0.06, 0));

      // сердцебиение: литавры + колокол, оба совпадают с ударами сердца на экране (Си♭ — Фа)
      for(let cy = 0; cy <= 1; cy++) {
        const g = g0 + cy * H;
        sfxTimpani(at(g), fr(-12), cy ? 0.6 : 0.85);
        sfxBell(at(g), hz(36), cy ? 0.05 : 0.07, -0.15);
        sfxTimpani(at(g + 0.34 * H), fr(-5), cy ? 0.42 : 0.55);
        sfxBell(at(g + 0.34 * H), hz(31), cy ? 0.04 : 0.05, 0.15);
      }

      // ---------- Разлёт: арфа сбегает по гамме вниз, хорал стихает на доминанте ----------
      const backStart = g0 + 2 * H - 0.13;
      [43, 41, 40, 38, 36, 35, 33, 31, 29, 28, 26, 24].forEach((semi, i) => {
        sfxHarp(at(backStart + i * (FLIGHT_DURATION * 0.8 / 12)), hz(semi), 0.075 - i * 0.003, 0.6 - i * 0.1);
      });

      // ---------- Финал («Богатырские ворота»): когда всё встало на места — tutti на тонике, колокольный перезвон ----------
      [-12, 0, 7, 12, 16, 19, 24].forEach((semi, i) => clBrass(at(endHit), fr(semi), 1.4, 0.06, -0.4 + i * 0.13));
      clStrings(at(endHit), 1.4, [0, 7, 12, 16, 19, 24].map(fr), 0.2, 0.03, 0.9);
      clViolin(at(endHit), fr(24), 1.4, 0.07, 0);                                      // ля → си♭: разрешение вводного тона
      sfxTimpani(at(endHit), fr(-12), 0.95);
      rmCrash(at(endHit), 0.08, 2.2);
      [24, 31, 36, 28, 40].forEach((semi, i) => sfxBell(at(endHit + i * 0.11), hz(semi), 0.09 - i * 0.008, -0.3 + i * 0.15));
      [12, 16, 19, 24, 28, 31, 36].forEach((semi, i) => sfxHarp(at(endHit + i * 0.06), hz(semi), 0.07, -0.4 + i * 0.13));
    }

    // =====================================================================
    // КЛАССИКА · ОРКЕСТР И ОРГАН — без арфы, колоколов и высоких щипков (никакой «шкатулки»):
    // только смычковые, духовая медь, орган и литавры, широкие длинные ноты (legato).
    // Оригинальная торжественная пьеса в ре мажоре, ≈ 115 BPM:
    //   нагнетание — виолончели и орган на педали, быстрая смычковая гамма вверх, дробь литавр;
    //   форма — широкая тема в унисон скрипок и валторн над хоралом органа (D – A/C# – Bm – G – A);
    //   разлёт — смычковая гамма вниз, доминанта, финальная каденция в ре мажор tutti.
    // =====================================================================
    // Орган: аддитивные регистры (основной тон + октава + квинта + две октавы), медленная атака
    function clOrgan(t, dur, freqs, vol, att = 0.1, rel = 0.35) {
      const c = sound.ctx;
      const master = c.createGain();
      master.gain.setValueAtTime(0.0001, t);
      master.gain.exponentialRampToValueAtTime(vol, t + att);
      master.gain.setValueAtTime(vol, t + Math.max(att, dur));
      master.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 4500; lp.Q.value = 0.5;
      lp.connect(master);
      const per = 1 / (freqs.length * 2.4);
      freqs.forEach(fr => {
        [[1, 1], [2, 0.55], [3, 0.35], [4, 0.22]].forEach(([r, amp]) => {
          const o = c.createOscillator();
          o.type = 'sine'; o.frequency.value = fr * r;
          const g = c.createGain(); g.gain.value = per * amp;
          o.connect(g); g.connect(lp);
          o.start(t); o.stop(t + dur + rel + 0.05);
        });
      });
      routeOut(master, 0, 0.08, 0.55);
    }

    function scheduleOrchestra(v, t0) {
      const c = sound.ctx;
      const r = sound.pitch;                           // ре мажор, транспонированный под кнопку
      const fr = semi => 73.42 * Math.pow(2, semi / 12) * r;      // semi — полутоны от D2
      const H = ANIM_PULSE / 2;
      const b = H / 2;                                 // доля (≈ 115 BPM)
      const g0 = t0 + ANIM_FWD + 0.12 * H;             // первый «тук» формы ≈ 4-я доля от начала
      const p0 = g0 - 4 * b;
      const now = c.currentTime;
      const at = t => Math.max(t, now + 0.005);
      const endT = t0 + ANIM_TOTAL;
      const endHit = endT - 0.12;
      if(sound.delay) sound.delay.delayTime.value = b * 0.5;

      // ---------- Нагнетание ----------
      clStrings(at(p0), 4 * b + 0.1, [fr(0), fr(7)], 0.14, 2.8, 0.4);               // виолончели/контрабасы: ре — ля
      clOrgan(at(p0), 4 * b + 0.1, [fr(-12), fr(0)], 0.1, 2.4, 0.4);               // педаль органа
      // быстрая смычковая гамма вверх (две октавы), крещендо
      const run = [12, 14, 16, 17, 19, 21, 23, 24, 26, 28, 29, 31, 33, 35, 36];
      run.forEach((semi, i) => {
        const k = i / (run.length - 1);
        clViolin(at(p0 + 0.9 * b + i * (2.6 * b / run.length)), fr(semi), 0.16, 0.025 + 0.045 * k, -0.4 + 0.8 * k, false);
      });
      // дробь литавр на ре, нарастающая к первому «туку»
      let tr = g0 - 1.7 * b;
      for(let i = 0; i < 10; i++) { sfxTimpani(at(tr), fr(0), 0.06 + 0.3 * (i / 9)); tr += 0.14 * Math.pow(0.9, i); }

      // ---------- Форма: тема над хоралом ----------
      rmCrash(at(g0), 0.07, 1.8);
      // хорал: аккорд — длина в долях — голоса (полутоны от D2): D | A/C# | Bm | G | A (до финала)
      const chords = [
        [0, 2, [0, 7, 12, 16, 19, 24]],
        [2, 1, [11, 14, 19, 23, 26]],
        [3, 1, [-3, 9, 16, 21, 24, 28]],
        [4, 1, [-7, 5, 12, 17, 21, 24]],
        [5, (endHit - g0) / b - 5, [-5, 7, 14, 19, 23, 26]]
      ];
      chords.forEach(([beat, len, notes]) => {
        const st = g0 + beat * b + 0.02, du = len * b - 0.05;
        clOrgan(at(st), du, notes.slice(0, 5).map(fr), 0.1, 0.06, 0.35);
        clStrings(at(st), du, notes.slice(1).map(fr), 0.1, 0.1, 0.3);
        notes.slice(1, 5).forEach((semi, i) => clBrass(at(st), fr(semi), du, 0.03, -0.3 + i * 0.2));
        clBrass(at(st), fr(notes[0]), du, 0.06, 0);                                  // туба/контрабасы
      });
      // тема: скрипки (без флейты) + валторны в унисон — широкая и певучая
      [[0, 28, 1.5], [1.5, 31, 0.5], [2, 35, 1], [3, 33, 1], [4, 29, 1], [5, 31, 1], [6, 35, (endHit - g0) / b - 6]].forEach(([beat, semi, len]) => {
        clViolin(at(g0 + beat * b), fr(semi), len * b * 0.95, 0.07, 0.1, false);
        clBrass(at(g0 + beat * b), fr(semi - 12), len * b * 0.95, 0.04, -0.1);
      });
      // сердцебиение: литавры ре — ля (два удара сердца), с мягким ударом контрабасов
      for(let cy = 0; cy <= 1; cy++) {
        const g = g0 + cy * H;
        sfxTimpani(at(g), fr(0), cy ? 0.6 : 0.85);
        sfxTimpani(at(g + 0.34 * H), fr(7), cy ? 0.42 : 0.55);
      }

      // ---------- Разлёт: смычковая гамма вниз ----------
      const backStart = g0 + 2 * H - 0.13;
      const down = [38, 36, 35, 33, 31, 29, 28, 26, 24, 23, 21, 19];
      down.forEach((semi, i) => {
        const k = i / (down.length - 1);
        clViolin(at(backStart + i * (FLIGHT_DURATION * 0.8 / down.length)), fr(semi), 0.18, 0.06 - 0.03 * k, 0.4 - 0.8 * k, false);
      });

      // ---------- Финал: ре мажор tutti ----------
      clOrgan(at(endHit), 1.6, [-12, 0, 7, 12, 16, 19, 24].map(fr), 0.16, 0.04, 1.0);
      clStrings(at(endHit), 1.6, [12, 16, 19, 24, 28, 31].map(fr), 0.2, 0.04, 1.0);
      [0, 7, 12, 16, 19, 24].forEach((semi, i) => clBrass(at(endHit), fr(semi), 1.6, 0.05, -0.4 + i * 0.16));
      clViolin(at(endHit), fr(36), 1.6, 0.075, 0, false);                             // ре: разрешение вводного тона до#
      sfxTimpani(at(endHit), fr(0), 0.95);
      rmCrash(at(endHit), 0.09, 2.2);
    }

    // Литавры: мягкий классический «тук» вместо электронного баса
    function sfxTimpani(t0, freq, vol) {
      const c = sound.ctx;
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 1.7, t0);
      osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.09);
      const body = c.createOscillator();
      body.type = 'triangle';
      body.frequency.value = freq * 1.5;           // обертон мембраны
      const bg = c.createGain();
      bg.gain.setValueAtTime(0.25, t0);
      bg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      body.connect(bg);
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
      osc.connect(env); bg.connect(env);
      osc.start(t0); body.start(t0);
      osc.stop(t0 + 0.75); body.stop(t0 + 0.3);

      // мягкий удар колотушки
      const n = c.createBufferSource();
      n.buffer = sound.noise;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 650;
      const ng = c.createGain();
      ng.gain.setValueAtTime(vol * 0.3, t0);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.04);
      n.connect(lp); lp.connect(ng); ng.connect(env);
      n.start(t0, Math.random()); n.stop(t0 + 0.05);
      routeOut(env, 0, 0.3);
    }

    // Три «тональности» для трёх кнопок: звук один и тот же по духу, но немного разный
    // pitch — транспонирование (полутоны от до мажора), run — пассаж в полутонах от C4,
    // runVol — громкость пассажа, beat — [удар 1, удар 2] литавр в Гц до транспонирования
    const SOUND_VARIANTS = {
      shape50: { pitch: -2, run: [0, 4, 7, 12, 16, 19, 24],                    runVol: 1.0, beat: [65.41, 49.0] },   // до мажор, арпеджио
      heart:   { pitch: 0,  run: [0, 2, 4, 7, 9, 12, 14, 16],                  runVol: 0.8, beat: [65.41, 55.0] },   // фа мажор, мягкая пентатоника
      text:    { pitch: -4, run: [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19],   runVol: 0.9, beat: [65.41, 49.0] }    // ре мажор, быстрая гамма
    };
    const SOUND_INSTRUMENTS = { harp: sfxHarp, musicbox: sfxMusicBox, carillon: sfxBell };

    // Расписание звука строго по таймлайну анимации
    function scheduleAnimationSound(type = 'shape50', lead = 0.03) {
      if(!ensureAudio()) return;
      const v = SOUND_VARIANTS[type] || SOUND_VARIANTS.shape50;
      sound.pitch = Math.pow(2, v.pitch / 12);
      const inst = SOUND_INSTRUMENTS[sound.style] || sfxHarp;
      const t0 = sound.ctx.currentTime + lead;
      const c4 = 261.63;
      const chord = [N.C3, N.G3, N.E4];
      if(sound.delay) sound.delay.delayTime.value = 0.23;
      if(sound.style === 'orchestra') { scheduleOrchestra(v, t0); return; }
      if(sound.style === 'mussorgsky') { scheduleMussorgsky(v, t0); return; }
      if(sound.style === 'classic') { scheduleClassic(v, t0); return; }
      if(sound.style === 'trap') { scheduleTrap(v, t0); return; }
      if(sound.style === 'rammstein') { scheduleRammstein(v, t0); return; }
      if(sound.style === 'ambient' || sound.style === 'ambient_low') { scheduleAmbient(v, t0); return; }

      // Пассаж: восходящий — при сборе в форму, нисходящий — при разлёте (вместо «вжуха»)
      const run = (start, dur, notes, rising) => {
        const seq = rising ? notes : notes.slice().reverse();
        const step = (dur * 0.85) / seq.length;
        seq.forEach((semi, i) => {
          const k = i / Math.max(1, seq.length - 1);
          const vol = (rising ? 0.045 + 0.075 * k : 0.095 - 0.05 * k) * v.runVol;
          const pan = rising ? -0.6 + 1.2 * k : 0.6 - 1.2 * k;
          inst(start + i * step, c4 * Math.pow(2, semi / 12), vol, pan);
        });
      };

      // 1) собираемся в форму: струнное крещендо + восходящий пассаж
      sfxStrings(t0, FLIGHT_DURATION * 0.9, chord, 0.07);
      run(t0, FLIGHT_DURATION, v.run, true);

      // 2) форма живёт: праздничная музыка + сердцебиение литаврами «тук-тук»
      const pulseStart = t0 + ANIM_FWD;
      sfxSparkle(pulseStart, ANIM_PULSE);
      const cyc = ANIM_PULSE / 2;
      for(let b = 0; b < 2; b++) {
        const base = pulseStart + b * cyc;
        sfxHeartBell(base + 0.12 * cyc, 1046.5 * sound.pitch, 0.12, -0.15);    // первый удар
        sfxHeartBell(base + 0.46 * cyc, 1568.0 * sound.pitch, 0.085, 0.15);    // второй, мягче
      }

      // 3) разлёт обратно в портрет: нисходящий пассаж
      const backStart = t0 + ANIM_FWD + ANIM_PULSE;
      sfxStrings(backStart, FLIGHT_DURATION * 0.7, chord, 0.05);
      run(backStart, FLIGHT_DURATION, v.run, false);
    }


    // ---------- КАЧЕСТВО (автоматически, без настроек): слабые устройства получают облегчённый холст ----------
    const LITE_SCALE = 0.667;
    function applyQuality() {
      const q = state.lite ? LITE_SCALE : 1;
      const w = Math.round(state.width * q), h = Math.round(state.height * q);
      if(canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      ctx.setTransform(q, 0, 0, q, 0, 0);
    }
    function updateReverbRouting() {
      if(!sound.reverbIn || !sound.conv) return;
      try { sound.reverbIn.disconnect(sound.conv); } catch(e) {}
      if(!state.lite) sound.reverbIn.connect(sound.conv);
    }
    function setLite(on) {
      state.lite = !!on;
      applyQuality();
      updateReverbRouting();
      render();
    }
    function detectLowEnd() {
      try {
        const cores = navigator.hardwareConcurrency || 8;
        const mem = navigator.deviceMemory || 8;
        const ua = navigator.userAgent || '';
        const oldIOS = /OS (9|10|11|12)_/.test(ua);
        const oldAndroid = /Android [1-6]\./.test(ua);
        return cores <= 2 || mem <= 2 || oldIOS || oldAndroid;
      } catch(e) { return false; }
    }

    // ---------- КНОПКИ ----------
    $('btnTrigger50').addEventListener('click', () => startShapeAnimation('shape50'));
    $('btnTriggerHeart').addEventListener('click', () => startShapeAnimation('heart'));
    $('btnTriggerBD').addEventListener('click', () => startShapeAnimation('text', 'B&D'));
    // подсветка-подсказка на кнопках исчезает после первого нажатия
    ['btnTrigger50', 'btnTriggerHeart', 'btnTriggerBD'].forEach(id => {
      $(id).addEventListener('click', () => document.querySelectorAll('.trigger-btn.hint').forEach(el => el.classList.remove('hint')));
    });

    if(detectLowEnd()) { state.lite = true; }
    applyQuality();

    // PWA без внешних файлов: манифест создаётся прямо здесь, иконки рисуются из встроенного SVG-логотипа
